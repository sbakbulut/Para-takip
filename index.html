  t("saglayici: typesafe secilince model",jevModelId()==="jev-latest",jevModelId());
  t("saglayici: bilinmeyen id yok sayilir",(function(){jevSetProvider("yok");return jevProvider()==="typesafe"})());
  jevSetProvider(prevProv);
  t("saglayici: geri yuklendi",jevEndpoint()===JEV_PROVIDERS[jevProvider()].endpoint);

  /* 10) Model override + "model yok" teshisi */
  jevSetModelOverride("typesafe/ozel-model");
  t("model: override gecerli",jevModelId()==="typesafe/ozel-model",jevModelId());
  t("model: override tek aday",jevModelCandidates().length===1&&jevModelCandidates()[0]==="typesafe/ozel-model");
  jevSetModelOverride("");
  t("model: override temizlenince varsayilana doner",jevModelId()===JEV_PROVIDERS[jevProvider()].model);
  t("model: 'does not exist' teshis edilir",jevIsModelMissing(400,"Model typesafe/jev-latest does not exist")===true);
  t("model: 401 model yok sayilmaz",jevIsModelMissing(401,"Model typesafe/jev-latest does not exist")===false);
  t("model: alakasiz 400 model yok degil",jevIsModelMissing(400,"invalid questions schema")===false);

  /* 11) Anahtar teshisi: TAM anahtar hicbir zaman gorunmez */
  var fakeKey="sk-or-v1-abcdef1234567890abcdef1234567890";
  var masked=jevMaskKey(fakeKey);
  t("teshis: anahtar maskelendi (sizinti yok)",masked.indexOf("abcdef1234567890")===-1,masked);
  t("teshis: sadece tur + uzunluk",masked.indexOf("OpenRouter")!==-1&&masked.indexOf(String(fakeKey.length))!==-1,masked);
  t("teshis: bos anahtar 'yok'",jevMaskKey("")==="yok");
  t("teshis: yabanci onek bildirilir",jevMaskKey("abc123").indexOf("taninmayan")!==-1);

  return r;
}

/* Anahtar TESHISI icin maskeli ozet: tam anahtar hicbir zaman gosterilmez. */
function jevMaskKey(k){
  k=String(k||"");
  if(!k)return "yok";
  var kind="taninmayan bicim";
  if(k.indexOf("sk-or-v1-")===0)kind="OpenRouter (sk-or-v1-)";
  else if(k.indexOf("sk-or-")===0)kind="OpenRouter (sk-or-)";
  else if(k.indexOf("ts-")===0)kind="TypeSafe (ts-)";
  else if(k.indexOf("sk-")===0)kind="sk- oneki";
  return kind+" · "+k.length+" karakter";
}

/* Ayar ekranindaki "Test" dugmesi: gercek Jev cagrisi yapip
   ADIM ADIM teshis dondurur. Ag YOKSA bile yapisal sonuc doner. */
async function jevTestRemote(lang){
  var tr=(lang==="tr");
  var steps=[];
  function step(label,ok,info){steps.push({label:label,ok:!!ok,info:info===undefined?"":String(info)})}

  /* 1) Yerel durum */
  var keyOk=!!JEV_CONFIG.apiKey;
  step(tr?"Jev anahtari okundu":"Jev key loaded",keyOk,jevMaskKey(JEV_CONFIG.apiKey));

  var out={
    ok:false,provider:jevProvider(),endpoint:jevEndpoint(),transport:JEV_CONFIG.transport,
    keyOk:keyOk,keyMask:jevMaskKey(JEV_CONFIG.apiKey),
    latencyMs:0,httpStatus:0,hint:"",code:"",message:"",model:null,detail:"",
    answers:[],steps:steps
  };
  if(!keyOk){
    step(tr?"Istek gonderildi":"Request sent",false,tr?"atlandi":"skipped");
    out.hint="nokey";
    out.message=tr?"Once Ayarlar -> Jev bolumunden bir API anahtari kaydet.":"Save an API key in Settings -> Jev first.";
    step(out.message,false,"");
    return out;
  }

  /* 2) Gercek cagri: uc tipin UCUNU de sinar (noul + choice + score) */
  var t0=jevNow();
  var res=await jevAskRemote(
    {domain:"health_check",app:"Para Kontrol",purpose:"connectivity check",check:"noul+choice+score"},
    {
      alive:{type:"noul",instructions:(tr?"Bu bir sistem saglik kontrolu; yanit verilebilir":"This is a system health check; a response is possible")},
      domain:{type:"choice",instructions:(tr?"Metin hangi alana ait?":"Which domain is this text about?"),criteria:{finance:(tr?"Finans/para":"Finance/money"),other:(tr?"Diger":"Other")}},
      quality:{type:"score",instructions:(tr?"Bu health-check istegi ne kadar net?":"How clear is this health-check request?"),criteria:[(tr?"belirsiz":"unclear"),(tr?"kismen net":"somewhat clear"),(tr?"cok net":"very clear")]}
    },
    lang
  );
  var ms=jevMs(t0);
  out.latencyMs=ms;
  out.hint=(res&&res.hint)||"";
  out.httpStatus=(res&&res.httpStatus)||0;
  out.detail=(res&&res.detail)||"";
  out.code=(res&&res.error&&res.error.code)||"";
  out.model=res&&res.model?res.model:null;
  out.modelUsed=(res&&res.modelUsed)||null;
  out.modelTried=(res&&res.modelTried)||[];

  step(tr?("Istek gonderildi ("+JEV_CONFIG.transport+")"):("Request sent ("+JEV_CONFIG.transport+")"),true,JEV_CONFIG.transport==="gas"?tr?"Apps Script proxy":"Apps Script proxy":jevEndpoint());

  if(!res.ok){
    out.message=(res.error&&res.error.message)||(tr?"Bilinmeyen hata":"Unknown error");
    step(tr?"Sunucu yaniti":"Server response",false,(out.httpStatus?("HTTP "+out.httpStatus+" · "):"")+out.code);
    step(out.message,false,out.detail?out.detail.slice(0,160):"");
    return out;
  }

  step(tr?"JSON guvenle ayristirildi":"JSON parsed safely",true,tr?"tipli":"typed");
  var keys=Object.keys(res.answers||{});
  step(tr?"Tipli cevaplar dogrulandi":"Typed answers validated",keys.length===3,keys.join(", "));

  /* 3) Her ilkelin gercekten deger dondurdugunu goster */
  var a=res.answers||{};
  if(a.alive)out.answers.push({q:"noul",v:Number(a.alive.noul).toFixed(2),c:(a.alive.confidence==null?null:a.alive.confidence)});
  if(a.domain)out.answers.push({q:"choice",v:String(a.domain.choice),c:a.domain.confidence});
  if(a.quality)out.answers.push({q:"score",v:String(a.quality.score)+" / "+Math.max(0,Object.keys(a.quality.legend||{}).length-1),c:a.quality.confidence});

  out.ok=true;
  out.message=tr?("Jev CALISIYOR — "+ms+" ms"):("Jev WORKING — "+ms+" ms");
  step(out.message,true,(out.modelUsed?out.modelUsed+" · ":"")+(out.model||""));
  if(out.modelTried.length>1)step(tr?"Yedek zincir denendi":"Fallback chain tried",true,out.modelTried.join(" → "));
  return out;
}

function fmt(n,cur){
  if(!cur)cur={sym:"₺",loc:"tr-TR"};
  if(n===""||n===null||typeof n==="undefined")return "0 "+cur.sym;
  var v=+n;
  if(isNaN(v)||!isFinite(v))return "0 "+cur.sym;
  /* Kuruslar korunur: tam sayilar sade, kuruslu tutarlar 2 haneli gosterilir */
  var r=Math.round(v*100)/100;
  var digits=(Math.abs(r-Math.round(r))>0.0001)?2:0;
  return r.toLocaleString(cur.loc,{minimumFractionDigits:digits,maximumFractionDigits:2})+" "+cur.sym;
}
/* Deger okuma: "1.234,56" (TR) ve "1,234.56" (EN) bicimlerinin ikisini de anlar.
   Ayirici tek ve 3 hane varsa binlik kabul edilir (para birimi icin dogru davranis);
   "0.500" gibi tam kismi 0 olan degerler ondalik sayilir. */
function parseNum(input){
  if(typeof input==="number")return isFinite(input)?input:NaN;
  if(input===null||typeof input==="undefined")return NaN;
  var s=String(input).trim();
  if(!s)return NaN;
  s=s.replace(/[^\d.,-]/g,"");
  if(!s||s==="-"||s==="-."||s==="-,")return NaN;
  var lastComma=s.lastIndexOf(","),lastDot=s.lastIndexOf(".");
  if(lastComma>-1&&lastDot>-1){
    /* Ikisi de var: en sagdaki ondalik ayiricidir, digeri binlik */

    var sep=lastComma>-1?",":(lastDot>-1?".":"");
    if(sep){
      var parts=s.split(sep);
      var intPart=parts[0].replace("-","");
      var lastGrp=parts[parts.length-1];
      var isThousands=(parts.length>1)&&(parts.length>2||(lastGrp.length===3&&intPart.length>0&&intPart!=="0"));
      if(isThousands)s=parts.join("");
      else if(parts.length===2)s=parts[0]+"."+parts[1];
    }
  }
  var v=parseFloat(s);
  return isNaN(v)?NaN:v;

/* ============================================================
   PIN GUVENLIGI — duz metin PIN yerine tuzlu SHA-256 ozeti
   Eski (duz metin) PIN ilk basarili girişte otomatik olarak
   ozetli bicime yukseltilir. Guvensiz baglam (http/file://)
   icin sifreleme yoksa geri donus olarak "plain:" bicimi.
   ============================================================ */
var PIN_KEY="pk_pin";
var PIN_LOCK_KEY="pk_pin_lock";
var PIN_MAX_TRIES=5;
var PIN_LOCK_MS=30000;

function pinLookup(){
  try{
    var s=localStorage.getItem(PIN_KEY);
    if(!s)return null;
    if(/^\d{4}$/.test(s))return{legacy:s}; /* v10 ve oncesi duz metin PIN */
    var p=s.split(":");
    if(p.length===3&&p[0]==="sha256"&&p[1]&&p[2])return{salt:p[1],hash:p[2]};
    if(p.length===3&&p[0]==="plain"&&p[2])return{plain:p[2]};
  }catch(e){}
  return null;
}
function pinIsSet(){try{return !!localStorage.getItem(PIN_KEY)}catch(e){return false}}
function pinRandomSalt(){
  try{
    var a=new Uint8Array(8);
    if(typeof crypto!=="undefined"&&crypto.getRandomValues)crypto.getRandomValues(a);
    else for(var i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
    return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){return String(Date.now())}
}
function pinSha256(text){
  try{
    if(typeof crypto!=="undefined"&&crypto.subtle&&crypto.subtle.digest&&typeof TextEncoder!=="undefined"){
      return crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
      });
    }
  }catch(e){}
  return Promise.resolve(null);
}
function pinSave(pin){
  var salt=pinRandomSalt();
  return pinSha256(salt+":"+pin).then(function(hash){
    try{
      if(hash)localStorage.setItem(PIN_KEY,"sha256:"+salt+":"+hash);
      else localStorage.setItem(PIN_KEY,"plain:"+salt+":"+pin);
      return true;
    }catch(e){return false}
  });
}
function pinVerify(pin){
  var rec=pinLookup();
  if(!rec)return Promise.resolve(false);
  if(rec.legacy)return Promise.resolve(String(pin)===rec.legacy);
  if(rec.plain)return Promise.resolve(String(pin)===rec.plain);
  if(rec.salt&&rec.hash)return pinSha256(rec.salt+":"+pin).then(function(hash){
    if(!hash)return false;
    return hash===rec.hash;
  });
  return Promise.resolve(false);
}

var DRIVE_MAX={

}
/* kontrol karakterlerini (satir sonu haric) temizle */
function sText(v,max){

/* Uzak veriyi temizler: {state, dropped, kept} dondurur (gecersizse null) */
function sanitizeRemote(raw){

  /* --- Gelir girişleri --- */
  var inc=[],rawInc=Array.isArray(raw.incomeEntries)?raw.incomeEntries.slice(0,DRIVE_MAX.incomeEntries):[];
  for(var k=0;k<rawInc.length;k++){
    var ri=rawInc[k];
    if(!ri||typeof ri!=="object"){dropped++;continue}
    var iAmt=sNum(ri.amount,0,DRIVE_MAX.maxAmount);

  }

    Object.keys(raw.incomes).slice(0,240).forEach(function(mk){
      var key=sMonthKey(mk),val=sNum(raw.incomes[mk],0,DRIVE_MAX.maxAmount);
      if(key&&val!==null)incMap[key]=val;else dropped++;
    });
  }
  out.incomes=incMap;

  /* --- Borçlar --- */
  var debts=[],rawDebts=Array.isArray(raw.debts)?raw.debts.slice(0,DRIVE_MAX.debts):[];
  for(var d=0;d<rawDebts.length;d++){
    var rd=rawDebts[d];
    if(!rd||typeof rd!=="object"){dropped++;continue}
    var dTotal=sNum(rd.total,0,DRIVE_MAX.maxAmount);
    var dPaid=sNum(rd.paid,0,DRIVE_MAX.maxAmount);
    if(dTotal===null||dPaid===null){dropped++;continue}
    var pays=[],rawPays=Array.isArray(rd.payments)?rd.payments.slice(0,DRIVE_MAX.payments):[];
    for(var q=0;q<rawPays.length;q++){
      var rp=rawPays[q];

      var pAmt=sNum(rp.amount,0,DRIVE_MAX.maxAmount),pDate=sDateStr(rp.date);
      if(pAmt===null||!pDate){dropped++;continue}

    }

    kept++;
  }
  out.debts=debts.length?debts:ini().debts;

  /* --- Butce limitleri (kategori id -> tutar) --- */
  var budgets={};
  if(raw.budgets&&typeof raw.budgets==="object"&&!Array.isArray(raw.budgets)){
    Object.keys(raw.budgets).slice(0,DRIVE_MAX.categories).forEach(function(bk){
      var catId=sStr(bk,40).replace(/[^A-Za-z0-9_]/g,"");
      var val=sNum(raw.budgets[bk],0,DRIVE_MAX.maxAmount);
      if(catId&&catIds[catId]&&val!==null&&val>0)budgets[catId]=val;else dropped++;
    });

  /* --- Hizli sablonlar --- */
  var tpls=[],rawTpls=Array.isArray(raw.templates)?raw.templates.slice(0,DRIVE_MAX.templates):[];
  for(var z=0;z<rawTpls.length;z++){
    var rt=rawTpls[z];

    var tAmt=sNum(rt.amount,0,DRIVE_MAX.maxAmount);

    tpls.push({id:sId(rt.id)||("tp_"+z),category:catOk(rt.category),amount:tAmt,note:sText(rt.note,DRIVE_MAX.noteLen),label:sText(rt.label,DRIVE_MAX.labelLen)});

    var pBud={};
    if(rpr.budgets&&typeof rpr.budgets==="object"&&!Array.isArray(rpr.budgets)){
      Object.keys(rpr.budgets).slice(0,DRIVE_MAX.categories).forEach(function(bk){
        var cid2=sStr(bk,40).replace(/[^A-Za-z0-9_]/g,"");
        var val2=sNum(rpr.budgets[bk],0,DRIVE_MAX.maxAmount);

  /* --- AI notlari (metin sinirlari) --- */

}

function remoteSuspicious(remote,local){

  async function drivePull(silent){
    if(!_driveEnabled())return false;
    if(syncStatus==="syncing")return false;
    if(!silent)setSyncStatus("syncing");
    try{
      var res=await drivePost("get");
      var text=await res.text();
      if(text.length>DRIVE_LIMIT_BYTES+200000){
        setSyncStatus("error");
        driveNoticeText(lang==="tr"?"Drive yanıtı çok büyük, güvenlik için uygulanmadı.":"Drive response too large; not applied for safety.");
        return false;
      }
      var json=null;
      try{json=JSON.parse(text)}catch(parseErr){
        if(typeof console!=="undefined")console.warn("[drivePull] non-JSON response (HTTP "+res.status+")");
        setSyncStatus("error");return false;
      }
      if(json.ok&&typeof json.data==="string"&&json.data){
        var parsed=null;
        try{parsed=JSON.parse(json.data)}catch(e){parsed=null}
        var clean=parsed?sanitizeRemote(parsed):null;
        if(!clean){
          setSyncStatus("error");
          driveNoticeText(lang==="tr"?"Drive'daki veri okunamadı/geçersiz — yerel verin korundu.":"Drive data is unreadable/invalid — local data kept.");
          return false;
        }
        if(clean.dropped>0){
          driveNoticeText((lang==="tr"?"Güvenlik: ":"Security: ")+clean.dropped+(lang==="tr"?" geçersiz kayıt atlandı.":" invalid record(s) were skipped."));
        }
        var why=remoteSuspicious(clean.state,S);
        if(why){
          setDrivePending(clean.state);
          setSyncStatus("conflict");
          driveNoticeText((lang==="tr"?"Uzaktaki veri boş/çok küçük görünüyor":"Remote data looks empty/too small")+" ("+why+"). "+(lang==="tr"?"Yerel verin korundu; ne yapmak istediğini seç.":"Local data kept; choose what to do."));
          return false;
        }
        applyRemote(clean.state);
        setLastSyncTs(Date.now());
        setSyncStatus("ok");
        return true;
      }
      if(json.error==="unauthorized"){setSyncStatus("unauth");return false}
      if(json.error==="server_token_missing"){
        setSyncStatus("unauth");
        driveNoticeText(lang==="tr"?"Apps Script'te token tanımlı değil (setToken ile kur).":"No token defined in Apps Script (run setToken).");
        return false;
      }
      if(json.error==="method_not_allowed"){
        setSyncStatus("error");
        driveNoticeText(lang==="tr"?"Script güvenli protokolü desteklemiyor — gas/Code.gs ile güncelle.":"Script does not support the secure protocol — update with gas/Code.gs.");
        return false;
      }
      if(json.error==="rate_limited"){
        setSyncStatus("error");
        driveNoticeText(lang==="tr"?"Script hız limiti aşıldı (dakikada 60). Kısa bir süre bekle.":"Script rate limit reached (60/min). Wait a moment.");
        return false;
      }
      if(json.error==="too_large"){
        setSyncStatus("error");
        driveNoticeText(lang==="tr"?"Veri 1 MB sınırını aşıyor, gönderilemedi.":"Data exceeds the 1 MB limit, not sent.");
        return false;
      }
      setSyncStatus("error");return false;
    }catch(e){
      if(typeof console!=="undefined")console.warn("[drivePull] network error:",String(e&&e.message?e.message:e));
      setSyncStatus(silent?"idle":"offline");
      return false;
    }
  }

  async function drivePush(){
    if(!_driveEnabled())return;
    if(S._demo){driveNoticeText(lang==="tr"?"Demo veriler Drive'a gönderilmez.":"Demo data is not pushed to Drive.");return}
    var payload=JSON.stringify(S);
    if(payload.length>DRIVE_LIMIT_BYTES){
      setSyncStatus("error");
      driveNoticeText(lang==="tr"?"Veri 1 MB sınırını aşıyor — gönderilmedi.":"Data exceeds the 1 MB limit — not sent.");
      return;
    }
    setSyncStatus("syncing");
    try{
      var res=await drivePost("put",{data:payload});
      var text=await res.text();
      var json=null;
      try{json=JSON.parse(text)}catch(parseErr){
        if(typeof console!=="undefined")console.warn("[drivePush] non-JSON response (HTTP "+res.status+")");
        setSyncStatus("error");return;
      }
      if(json.ok){
        setLastSyncTs(Date.now());
        setSyncStatus("ok");
      }else{
        if(typeof console!=="undefined")console.warn("[drivePush] error:",json.error);
        setSyncStatus(json.error==="unauthorized"?"unauth":"error");
        if(json.error==="unauthorized")driveNoticeText(lang==="tr"?"Token reddedildi. Apps Script token'ı ile uygulamadaki token aynı mı? (min 16 karakter)":"Token rejected. Does the app token match the Apps Script token? (min 16 chars)");
        else if(json.error==="too_large")driveNoticeText(lang==="tr"?"Veri 1 MB sınırını aşıyor.":"Data exceeds the 1 MB limit.");
        else if(json.error==="rate_limited")driveNoticeText(lang==="tr"?"Script hız limiti aşıldı, biraz bekle.":"Script rate limit reached, wait a moment.");
      }
    }catch(e){
      if(typeof console!=="undefined")console.warn("[drivePush] network error:",String(e&&e.message?e.message:e));
      setSyncStatus("offline");
    }
  }

  /* Protokol/kurulum testi: veri YAZMAZ ve gercek token'i URL'de gondermez */
  async function driveTest(){
    var base=driveUrlFor();
    if(!base){driveNoticeText(lang==="tr"?"Önce Web App URL'ini gir.":"Enter the Web App URL first.");return}
    setSyncStatus("syncing");
    var L=[];
    function flush(){setDriveNotice(L.join("\n"))}
    flush();
    try{
      var p=await drivePost("ping");
      var pt=await p.text();
      var pj=null;try{pj=JSON.parse(pt)}catch(e){}
      if(pj&&pj.ok)L.push("✓ "+(lang==="tr"?"Güvenli protokol çalışıyor (script rev ":"Secure protocol works (script rev ")+(pj.rev||"?")+", "+(pj.hasData?(lang==="tr"?"kayıt var":"has data"):(lang==="tr"?"kayıt yok":"no data"))+")");
      else if(pj&&pj.error==="unauthorized")L.push("✗ ping: "+(lang==="tr"?"token reddedildi — apps script ve uygulama token'ı aynı mı?":"token rejected — do the tokens match?"));
      else if(pj&&pj.error==="server_token_missing")L.push("✗ ping: "+(lang==="tr"?"Apps Script'te token tanımlı değil (setToken)":"no token in Apps Script (run setToken)"));
      else if(pj&&pj.error)L.push("✗ ping: "+pj.error);
      else L.push("✗ ping: HTTP "+p.status+" "+String(pt).slice(0,120));
    }catch(e){L.push("✗ ping "+(lang==="tr"?"bağlantı hatası: ":"connection error: ")+String(e&&e.message?e.message:e))}
    flush();
    /* Eski zayif yol (URL'de token) hala acik mi? Gercek token GONDERILMEZ. */
    try{
      var lg=await fetch(base+"?token=__probe__",{method:"GET",cache:"no-store"});
      var lt=await lg.text();
      var lj=null;try{lj=JSON.parse(lt)}catch(e){}
      if(lg.status===405||(lj&&lj.error==="method_not_allowed"))L.push("✓ "+(lang==="tr"?"URL'de token yolu kapalı (güvenli)":"URL-token path is closed (secure)"));
      else if(lj&&lj.error==="unauthorized")L.push("⚠ "+(lang==="tr"?"GÜVENLİK: script hâlâ URL'deki token'ı kabul ediyor — gas/Code.gs ile güncelle":"SECURITY: script still accepts tokens in the URL — update with gas/Code.gs"));
      else L.push("? "+(lang==="tr"?"Eski yol yanıtı: HTTP ":"Legacy path response: HTTP ")+lg.status+" "+String(lt).slice(0,80));
    }catch(e){
      L.push("• "+(lang==="tr"?"Eski yol ölçülemedi (CORS) — istemci artık URL'de token göndermiyor":"Legacy path not measurable (CORS) — the app no longer sends tokens in URLs"));
    }
    flush();
    setSyncStatus("idle");
  }

  function _voiceLoadVoices(){
    if(typeof window==="undefined"||!window.speechSynthesis)return;
    var voices=window.speechSynthesis.getVoices()||[];
    /* Türkçe önce, sonra İngilizce, sonra diğerleri */
    var tr=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("tr")===0});
    var en=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0});
    var other=voices.filter(function(v){return !v.lang||(v.lang.toLowerCase().indexOf("tr")!==0&&v.lang.toLowerCase().indexOf("en")!==0)});
    setVoiceList(tr.concat(en).concat(other));
  }

  function _voiceStopSpeak(){
    try{if(typeof window!=="undefined"&&window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}
    try{if(_voiceAudioElR.current){_voiceAudioElR.current.onended=null;_voiceAudioElR.current.pause();_voiceAudioElR.current.currentTime=0}}catch(e){}
  }

  async function _voiceSpeak(text){
    if(typeof window==="undefined"||!text)return;
    _voiceStopSpeak();
    /* DeepSeek sadece metin uretir; seslendirme tarayicinin Web Speech motoruyla yapilir */
    if(!window.speechSynthesis){
      setVoiceSpeaking(false);
      setVoiceErr(lang==="tr"?"Bu tarayıcı sesli okumayı desteklemiyor.":"This browser does not support spoken replies.");
      return;
    }
    try{
      var spoken=String(text).slice(0,600);
      var u=new SpeechSynthesisUtterance(spoken);
      var voice=null;
      try{
        var voices=window.speechSynthesis.getVoices()||[];
        if(voiceSelectedURI)voice=voices.filter(function(v){return v.voiceURI===voiceSelectedURI})[0]||null;
        if(!voice){
          var want=(lang==="en")?"en":"tr";
          voice=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(want)===0})[0]||null;

  function buildAiContext(){
    var ctx={month:vMK,income:mIn,expense:tM,categories:{},recent:[],recurring:[],budgets:S.budgets||{},todayDate:tdy(),today:[],dailyBreakdown:[]};
    /* Lokal kategori toplamlarını hesapla (currByCat App scope'unda olmayabilir) */
    var localCurr={},localPrev={};
    /* Görüntülenen aya göre bir önceki ay anahtarı — cMK (bugünün ayı) değil */
    var _vp=vMK.split("-"),_vy=+_vp[0],_vm=+_vp[1]-1;
    var _prevDate=new Date(_vy,_vm-1,1);
    var prevMK=mkk(_prevDate.getFullYear(),_prevDate.getMonth());
    var monthExp=(S.expenses||[]).filter(function(e){return e.date&&String(e.date).slice(0,7)===vMK});
    monthExp.forEach(function(e){
      localCurr[e.category]=(localCurr[e.category]||0)+e.amount;
    });
    (S.expenses||[]).filter(function(e){return e.date&&String(e.date).slice(0,7)===prevMK}).forEach(function(e){
      localPrev[e.category]=(localPrev[e.category]||0)+e.amount;
    });
    cats.forEach(function(c){
      var spent=localCurr[c.id]||0;
      var prev=localPrev[c.id]||0;
      var budget=(S.budgets&&S.budgets[c.id])||0;
      if(spent>0||prev>0||budget>0){
        ctx.categories[c.id]={label:c.label,icon:c.icon,spent:spent,prev:prev,budget:budget};
      }
    });

    /* Bugünün harcamaları — AYRICA ve tam liste */
    /* Esnek eşleştirme: date alanı YYYY-MM-DD veya başka formatta olabilir */
    var today=tdy();
    var todayY=today.slice(0,4);
    var todayM=today.slice(5,7);
    var todayD=today.slice(8,10);
    var todayAlt=todayD+"."+todayM+"."+todayY; /* 12.09.2026 */
    var todayAlt2=todayD+"/"+todayM+"/"+todayY;
    monthExp.filter(function(e){
      if(!e.date)return false;
      var d=String(e.date).trim();
      /* Direkt eşleşme */
      if(d===today||d===todayAlt||d===todayAlt2)return true;
      /* Tarih içeriyor mu? (örn. "2026-09-12T00:00" veya "12.09.2026 03:36") */
      if(d.indexOf(today)===0)return true;
      if(d.indexOf(todayAlt)!==-1)return true;
      if(d.indexOf(todayAlt2)!==-1)return true;
      /* Son 24 saat içinde mi? (timestamp olabilir) */
      var ts=Date.parse(d);
      if(!isNaN(ts)){
        var diff=Date.now()-ts;
        if(diff>=0&&diff<36*60*60*1000)return true; /* 36 saat tolerans */
      }
      return false;
    }).forEach(function(e){
      var catObj=cats.find(function(c){return c.id===e.category});
      ctx.today.push({amount:e.amount,category:catObj?catObj.label:e.category,note:e.note||"",time:e.time||""});
    });
    ctx.todayTotal=ctx.today.reduce(function(s,e){return s+e.amount},0);

    /* Günlük özet — ay içindeki her günün toplamı (son 14 gün) */
    var dayMap={};
    monthExp.forEach(function(e){
      var raw=e.date;
      if(!raw)return;
      var norm=String(raw).trim();
      /* YYYY-MM-DD formatına normalize etmeye çalış */
      var normDate=null;
      /* 2026-09-12 direkt */
      if(/^\d{4}-\d{2}-\d{2}/.test(norm)){
        normDate=norm.slice(0,10);
      }else if(/^\d{2}\.\d{2}\.\d{4}/.test(norm)){ /* 12.09.2026 */
        var p=norm.split(".");
        normDate=p[2]+"-"+p[1]+"-"+p[0];
      }else if(/^\d{2}\/\d{2}\/\d{4}/.test(norm)){ /* 12/09/2026 */
        var p=norm.split("/");
        normDate=p[2]+"-"+p[1]+"-"+p[0];
      }else{
        var ts=Date.parse(norm);
        if(!isNaN(ts)){
          var dd=new Date(ts);
          normDate=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
        }
      }
      if(normDate){
        dayMap[normDate]=(dayMap[normDate]||0)+e.amount;
      }
    });
    var today_d=new Date();
    var cutoff=new Date(today_d.getFullYear(),today_d.getMonth(),today_d.getDate()-13);
    Object.keys(dayMap).forEach(function(d){
      var dt=new Date(d+"T00:00:00");
      if(!isNaN(dt.getTime())&&dt>=cutoff){
        ctx.dailyBreakdown.push({date:d,total:dayMap[d]});
      }
    });
    ctx.dailyBreakdown.sort(function(a,b){return a.date.localeCompare(b.date)});

    /* Son harcamalar (genel liste) */
    monthExp.slice(-12).forEach(function(e){
      var catObj=cats.find(function(c){return c.id===e.category});
      ctx.recent.push({amount:e.amount,category:catObj?catObj.label:e.category,note:e.note||"",date:e.date});
    });
    (S.recurring||[]).slice(0,8).forEach(function(r){
      ctx.recurring.push({label:r.label||"",amount:r.amount,category:r.category||""});
    });
    return ctx;
  }

  function ctxToPrompt(ctx){
    var lines=[];
    lines.push("=== TODAY'S DATA (ONLY TODAY, "+ctx.todayDate+") ===");
    if(ctx.today.length>0){
      /* Liste gerçekten dolu, her satırı tek tek yaz */
      lines.push("TODAY_EXPENSES (count: "+ctx.today.length+"):");
      ctx.today.forEach(function(e){
        lines.push("  - "+(e.amount+" TL")+" ("+e.category+")"+(e.time?" at "+e.time:"")+(e.note?" note=\""+e.note+"\"":""));
      });
      /* Toplamı listeden kendisi hesaplayacak şekilde yaz */
      var sumFromList=ctx.today.reduce(function(s,e){return s+e.amount},0);
      lines.push("TODAY_LIST_SUM: "+sumFromList+" TL (sum of items listed above)");
      lines.push("If TODAY_LIST_SUM > 0 then today HAS spending. Items listed above are FACT.");
    }else{
      lines.push("TODAY_EXPENSES: NONE");
      lines.push("TODAY_LIST_SUM: 0 TL (empty list)");
      lines.push("If TODAY_LIST_SUM == 0 then today has NO spending.");
    }
    lines.push("---");
    lines.push("Ay: "+ctx.month);
    lines.push("Gelir: "+ctx.income+" TL");
    lines.push("Toplam harcama: "+ctx.expense+" TL");
    if(ctx.income>0)lines.push("Gelirin kullanim orani: "+Math.round((ctx.expense/ctx.income)*100)+"%");
    if(ctx.dailyBreakdown&&ctx.dailyBreakdown.length>0){
      lines.push("Son 14 gunun gunluk toplamlari:");
      ctx.dailyBreakdown.forEach(function(d){
        var isToday=d.date===ctx.todayDate;
        lines.push("- "+d.date+(isToday?" (BUGUN)":"")+": "+d.total+" TL");
      });
    }
    var catEntries=Object.keys(ctx.categories);
    if(catEntries.length>0){
      lines.push("Kategori harcamalari:");
      catEntries.forEach(function(k){
        var c=ctx.categories[k];
        lines.push("- "+c.icon+" "+c.label+": "+c.spent+" TL (gecen ay: "+c.prev+" TL"+(c.budget>0?", butce: "+c.budget+" TL":"")+")");
      });
    }
    if(ctx.recurring.length>0){
      lines.push("Tekrarlayan odemeler:");
      ctx.recurring.forEach(function(r){lines.push("- "+r.label+": "+r.amount+" TL/ay");});
    }
    if(ctx.recent.length>0){
      lines.push("Son harcamalar (genel liste):");
      ctx.recent.forEach(function(e){lines.push("- "+e.date+" "+e.amount+" TL "+e.category+(e.note?" ("+e.note+")":""));});
    }
    return lines.join("\n");
  }

  ef(function(){

  /* Sebep kodlarini yerellestirilmis metne cevir (karar koddan geliyor) */
  function jevReasonLines(v,lang){
    if(!v)return [];
    var tr=(lang==="tr"),out=[];
    var F=function(n){return f(n)};
    (v.reasons||[]).forEach(function(code){
      if(code==="over_budget")out.push(tr?("Butceyi "+F(v.deficitAmount)+" asiyor."):("Exceeds the budget by "+F(v.deficitAmount)+"."));
      else if(code==="near_limit")out.push(tr?("Kategori butcesinin %"+Math.round((v.budgetUsedRatio||0)*100)+"'inde."):("At "+Math.round((v.budgetUsedRatio||0)*100)+"% of the category budget."));
      else if(code==="projection_over")out.push(tr?("Bu hizla ay sonu "+F(v.projectedMonthEnd)+" olur (butce "+F(v.budget)+")."):("At this pace month-end is "+F(v.projectedMonthEnd)+" (budget "+F(v.budget)+")."));
      else if(code==="model_veto")out.push(tr?"Jev bu harcamanin butceye sigmadigini dusunuyor.":"Jev judges this does not fit the budget.");
      else if(code==="likely_recurring")out.push(tr?("Tekrarlayan odeme gibi (%"+Math.round((v.repeatRisk||0)*100)+")."):("Looks recurring ("+Math.round((v.repeatRisk||0)*100)+"%)."));
      else if(code==="non_essential")out.push(tr?"Zorunlu bir harcama gibi gorunmuyor.":"Does not look like an essential expense.");
      else if(code==="no_budget")out.push(tr?"Bu kategoride butce tanimli degil; aylik gelire gore bakildi.":"No budget set for this category; judged against monthly income.");
    });
    return out.slice(0,3);
  }

  /* MODUL 1 — ANLIK RISK KAPISI. Render icinde uretilir; DeepSeek beklenmez. */
  function jevGateUi(){

    /* "safe" ve sebep yoksa gurultu yapma */
    if(!isBad&&!isWarn&&(v.reasons||[]).length===0)return null;
    var lines=jevReasonLines(v,lang);
    var col=isBad?"var(--red)":(isWarn?"var(--amber)":"var(--green)");
    var ttl=isBad?(lang==="tr"?"BUTCENI ASIYOR":"OVER BUDGET")
            :(isWarn?(lang==="tr"?"BUTCEYI ZORLUYOR":"STRAINING THE BUDGET")
            :(lang==="tr"?"BUTCE ICINDE":"WITHIN BUDGET"));
    var srcTag=(v.source==="code")?(lang==="tr"?"yerel kural":"local rule"):"jev";
    return html`<div style=${{padding:"11px 13px",borderRadius:"var(--radius-sm)",marginBottom:10,background:isBad?"rgba(255,68,102,0.10)":(isWarn?"rgba(245,158,11,0.10)":"rgba(6,255,165,0.06)"),border:"1px solid "+(isBad?"rgba(255,68,102,0.3)":(isWarn?"rgba(245,158,11,0.28)":"rgba(6,255,165,0.22)"))}}>

  /* MODUL 2 — serbest metinden otomatik doldurma onerisi */
  function jevSuggestUi(){
    var sug=(jevSuggest!==null)?jevSuggest:jevSuggestLocal;
    if(!sug)return null;
    if(!sug.category&&sug.amount==null)return null;
    var cobj=sug.category?fc(sug.category):null;
    var pct=Math.round((sug.confidence||0)*100);
    var manual=!!sug.requiresManualReview;
    var col=manual?"var(--amber)":"var(--blue2)";
    return html`<div style=${{display:"flex",alignItems:"center",gap:8,padding:"9px 11px",borderRadius:"var(--radius-xs)",marginBottom:10,background:"rgba(59,130,246,0.08)",border:"1px solid "+(manual?"rgba(245,158,11,0.28)":"rgba(59,130,246,0.25)")}}>
      <span style=${{fontSize:14}}>${manual?"🤔":"🪄"}</span>
      <div style=${{flex:1,minWidth:0}}>
        <div style=${{fontSize:10,fontWeight:800,color:col}}>
          ${cobj?(cobj.icon+" "+cobj.label):(lang==="tr"?"Kategori belirsiz":"Category unclear")}
          ${sug.amount!=null?html`<span style=${{color:"var(--sub)",fontWeight:700}}> · ${f(sug.amount)}</span>`:null}
          <span style=${{color:"var(--dim)",fontWeight:700}}> · %${pct}</span>
        </div>
        <div style=${{fontSize:9,color:"var(--dim)",marginTop:1}}>${manual?(lang==="tr"?"Jev emin degil — kontrol et":"Jev is not confident — review"):(lang==="tr"?"Jev metinden cikardi":"Jev extracted this")}${sug.engine==="typesafe"?" · Jev API":""}</div>

      <button onClick=${function(){applyJevSuggestion(sug)}} style=${{padding:"6px 10px",borderRadius:"var(--radius-xs)",border:"none",background:"linear-gradient(135deg,#3b82f6,#6366f1)",color:"#fff",fontSize:10,fontWeight:800,cursor:"pointer",flexShrink:0}}>${lang==="tr"?"Doldur":"Fill"}</button>
      ${jevEngine()==="typesafe"&&html`<button onClick=${function(){refineJevSuggestion(sug.text)}} title=${lang==="tr"?"Jev API ile tekrar sor":"Ask Jev API again"} style=${{padding:"6px 8px",borderRadius:"var(--radius-xs)",border:"1px solid var(--border)",background:"var(--card2)",color:"var(--sub)",fontSize:10,fontWeight:700,cursor:"pointer",flexShrink:0}}>↻</button>`}
    </div>`;
  }

        ${voiceHistory.length===0&&!voiceTranscript&&!voiceAiText?html`<div style=${{padding:"20px 14px",borderRadius:"var(--radius-sm)",background:"rgba(16,185,129,0.06)",border:"1px dashed rgba(16,185,129,0.28)",textAlign:"center"}}>
          <p style=${{fontSize:11,color:"var(--sub)",lineHeight:1.6}}>${lang==="tr"?'🎤 Aşağıdaki mikrofona dokun ve Türkçe konuş. M3 cevap verecek. Live mod açıksa konuşma otomatik devam eder.':'🎤 Tap the mic and speak. M3 will respond. With Live mode on, the conversation continues automatically.'}</p>
        </div>`:null}
        ${voiceHistory.filter(function(m){return m.role==="assistant"}).map(function(m,i){return html`<div key=${"vh_"+i} style=${{display:"flex",justifyContent:"flex-start"}}>
          <div style=${{maxWidth:"92%",padding:"10px 14px",borderRadius:"14px 14px 14px 4px",background:"var(--card2)",border:"1px solid var(--border)",color:"var(--txt)",fontSize:12,lineHeight:1.5,whiteSpace:"pre-wrap"}}>${m.content}</div>
        </div>`})}
        ${voiceTranscript&&html`<div style=${{display:"flex",justifyContent:"flex-start",alignItems:"center",gap:6,padding:"6px 12px"}}>
          <div style=${{display:"flex",gap:3}}>
            <div style=${{width:5,height:5,borderRadius:3,background:"var(--blue2)",animation:"pulse 0.9s infinite"}}/>
            <div style=${{width:5,height:5,borderRadius:3,background:"var(--blue2)",animation:"pulse 0.9s 0.2s infinite"}}/>
            <div style=${{width:5,height:5,borderRadius:3,background:"var(--blue2)",animation:"pulse 0.9s 0.4s infinite"}}/>
          </div>
          <span style=${{fontSize:10,color:"var(--blue2)",fontWeight:700}}>${lang==="tr"?"dinliyor…":"listening…"}</span>
        </div>`}
        ${aiLoading&&html`<div style=${{display:"flex",justifyContent:"flex-start"}}>
          <div style=${{padding:"9px 14px",borderRadius:"14px 14px 14px 4px",background:"var(--card2)",border:"1px solid var(--border)",display:"flex",alignItems:"center",gap:6}}>
            <div style=${{width:6,height:6,borderRadius:3,background:"var(--purple)",animation:"pulse 0.9s infinite"}}/>
            <div style=${{width:6,height:6,borderRadius:3,background:"var(--purple)",animation:"pulse 0.9s 0.2s infinite"}}/>
            <div style=${{width:6,height:6,borderRadius:3,background:"var(--purple)",animation:"pulse 0.9s 0.4s infinite"}}/>
          </div>
        </div>`}
      </div>

      ${voiceErr&&html`<div style=${{padding:"8px 11px",borderRadius:8,background:"rgba(255,68,102,0.10)",border:"1px solid rgba(255,68,102,0.24)",color:"var(--red)",fontSize:11,marginBottom:8,lineHeight:1.4}}>
        ${voiceErr}
      </div>`}

      <div style=${{display:"flex",justifyContent:"center",alignItems:"center",padding:"12px 0",gap:12,position:"relative"}}>
        <button onClick=${voiceToggle} disabled=${!voiceSupported} style=${{width:72,height:72,borderRadius:36,border:"none",background:voiceListening?"linear-gradient(135deg,#ef4444,#dc2626)":voiceSpeaking?"linear-gradient(135deg,#10b981,#059669)":"linear-gradient(135deg,#10b981,#059669)",color:"#fff",fontSize:30,cursor:voiceSupported?"pointer":"not-allowed",boxShadow:voiceListening?"0 0 0 8px rgba(239,68,68,0.18),0 0 0 16px rgba(239,68,68,0.08)":voiceSpeaking?"0 0 0 8px rgba(16,185,129,0.18)":"0 0 0 8px rgba(16,185,129,0.18),0 0 0 16px rgba(16,185,129,0.06)",transition:"all 0.2s",display:"flex",alignItems:"center",justifyContent:"center",animation:voiceListening?"pulse 1.2s infinite":"none"}}>
          ${voiceListening?"⏹":voiceSpeaking?"🔊":"🎤"}
        </button>
      </div>
      <p style=${{textAlign:"center",fontSize:10,color:"var(--sub)",marginTop:-4,marginBottom:0}}>
        ${voiceListening?(lang==="tr"?"Konuş, bitince otomatik gönderilecek":"Speak, auto-sends when done"):voiceSpeaking?(lang==="tr"?"M3 konuşuyor…":"M3 is speaking…"):voiceLive?(lang==="tr"?"Live mod açık — mikrofona dokun":"Live mode on — tap the mic"):(lang==="tr"?"Mikrofona dokun ve konuş":"Tap the mic and speak")}
      </p>
      ${!voiceSupported?html`<p style=${{textAlign:"center",fontSize:10,color:"var(--red)",marginTop:6}}>${lang==="tr"?"Tarayıcın sesli girişi desteklemiyor. Chrome veya Edge dene.":"Your browser doesn't support voice input. Try Chrome or Edge."}</p>`:null}
    </div>
  </div>`}

  ${aiPreModal&&html`<div onClick=${function(){if(!aiLoading)setAiPreModal(false)}} style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",backdropFilter:"blur(6px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick=${function(e){e.stopPropagation()}} class="glass" style=${{width:"100%",maxWidth:420,padding:22,borderRadius:20,background:dk?"rgba(13,17,23,0.97)":"rgba(255,255,255,0.97)"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <span style=${{fontSize:22}}>💡</span>
        <div style=${{flex:1}}>
          <p style=${{fontSize:14,fontWeight:800,color:"var(--txt)"}}>${lang==="tr"?"Akıl Danışma":"Pre-Spend Advice"}</p>
          <p style=${{fontSize:11,color:"var(--sub)"}}>${aiPreVerdict?(aiPreVerdict.amount+" TL • "+aiPreVerdict.category):(lang==="tr"?"Harcamayı değerlendiriyor…":"Evaluating…")}</p>
        </div>
        <button onClick=${function(){if(!aiLoading)setAiPreModal(false)}} style=${{width:30,height:30,borderRadius:8,background:"var(--card)",border:"1px solid var(--border)",color:"var(--sub)",fontSize:18,cursor:"pointer"}}>×</button>
      </div>

      ${aiLoading&&html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:12,padding:"30px 20px"}}>
        <div style=${{width:36,height:36,borderRadius:18,border:"3px solid rgba(168,85,247,0.2)",borderTopColor:"#a855f7",animation:"spin 0.8s linear infinite"}}/>
        <p style=${{fontSize:12,color:"var(--sub)",fontWeight:600}}>${lang==="tr"?"DeepSeek V4.1 Flash düşünüyor…":"DeepSeek V4.1 Flash is thinking…"}</p>
      </div>`}

      ${aiPreVerdict&&!aiLoading&&html`<div>
        <div style=${{padding:14,borderRadius:"var(--radius-sm)",marginBottom:12,background:aiPreVerdict.level==="bad"?"rgba(255,68,102,0.10)":(aiPreVerdict.level==="warn"?"rgba(245,158,11,0.10)":"rgba(6,255,165,0.08)"),border:aiPreVerdict.level==="bad"?"1px solid rgba(255,68,102,0.24)":(aiPreVerdict.level==="warn"?"1px solid rgba(245,158,11,0.24)":"1px solid rgba(6,255,165,0.24)")}}>
          <p style=${{fontSize:10,fontWeight:800,marginBottom:6,letterSpacing:"0.05em",textTransform:"uppercase",color:aiPreVerdict.level==="bad"?"var(--red)":(aiPreVerdict.level==="warn"?"var(--amber)":"var(--green)")}}>${aiPreVerdict.level==="bad"?(lang==="tr"?"⚠️ TEHLİKE: Yeniden düşün":"⚠️ DANGER: Reconsider"):(aiPreVerdict.level==="warn"?(lang==="tr"?"⚡ DİKKAT: Bütçeni zorlayabilir":"⚡ CAUTION: Could strain budget"):(lang==="tr"?"✓ UYGUN GÖRÜNÜYOR":"✓ LOOKS FINE"))}</p>
          <p style=${{fontSize:13,lineHeight:1.65,color:"var(--txt)",whiteSpace:"pre-wrap"}}>${aiPreVerdict.text}</p>
        </div>
        <div style=${{display:"flex",gap:8}}>
          <button onClick=${function(){setAiPreModal(false)}} style=${{flex:1,padding:"11px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border)",background:"var(--card2)",color:"var(--txt)",fontSize:13,fontWeight:700,cursor:"pointer"}}>${lang==="tr"?"Vazgeçtim":"Skip"}</button>
          <button onClick=${function(){setAiPreModal(false);addExp()}} style=${{flex:2,padding:"11px",borderRadius:"var(--radius-sm)",border:"none",background:"linear-gradient(135deg,#06ffa5,#00d084)",color:"#0f172a",fontSize:13,fontWeight:800,cursor:"pointer"}}>${lang==="tr"?"Yine de Kaydet":"Save Anyway"}</button>
        </div>
        <p style=${{fontSize:10,color:"var(--dim)",marginTop:8,textAlign:"center"}}>${lang==="tr"?"Karar senin — AI sadece fikir veriyor.":"It's your call — AI only advises."}</p>
      </div>`}

      ${aiErr&&!aiLoading&&!aiPreVerdict&&html`<div style=${{padding:"12px 14px",borderRadius:8,background:"rgba(255,68,102,0.10)",border:"1px solid rgba(255,68,102,0.24)",color:"var(--red)",fontSize:11,lineHeight:1.5,marginBottom:10}}>
        <strong>${lang==="tr"?"Hata:":"Error:"}</strong> ${aiErr}
      </div>`}
    </div>
  </div>`}

  <!-- BOTTOM TAB BAR -->
  <div style=${{position:"fixed",bottom:0,left:0,right:0,padding:"12px 16px 16px",zIndex:100,background:dk?"linear-gradient(to top, rgba(7,9,15,0.98) 60%, rgba(7,9,15,0) 100%)":"linear-gradient(to top, rgba(240,237,232,0.98) 60%, rgba(240,237,232,0) 100%)"}}>
    <div class="tabbar" style=${{maxWidth:448,margin:"0 auto"}}>
      ${[{id:"harcama",lk:"tab_exp",i:"✏️"},{id:"borc",lk:"tab_debts",i:"💳"},{id:"butce",lk:"tab_budget",i:"📊"},{id:"ozet",lk:"tab_summary",i:"📈"}].map(function(tb){var act=tab===tb.id;var showBadge=(tb.id==="butce"&&budgetAlert&&!act)||(tb.id==="ozet"&&jevAnomalies.length>0&&!act);var badgeHot=tb.id==="ozet"&&jevHighCount>0;return html`<button key=${tb.id} onClick=${function(){setTab(tb.id)}} class=${"tab-btn"+(act?" active":"")}>
        <div style=${{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
          <span style=${{fontSize:18}}>${tb.i}</span>
          ${showBadge&&html`<span class="notif-dot" style=${{position:"absolute",top:-2,right:-6,background:badgeHot?"var(--red)":"var(--amber)",boxShadow:"0 0 6px "+(badgeHot?"var(--redglow)":"rgba(245,158,11,0.45)")}}/>`}
        </div>
        <span>${t(tb.lk)}</span>
      </button>`})}
    </div>
  </div>

  </div>`;
}
var _pkRoot=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(_pkRoot).render(React.createElement(App));}
else{ReactDOM.render(React.createElement(App),_pkRoot);}

</script>
</body>
</html>
