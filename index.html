var html=htm.bind(React.createElement);
var h=React.useState,ef=React.useEffect,um=React.useMemo,ur=React.useRef;

/* ============================================================
   SURUM
   ============================================================ */
var APP_VERSION="12.2";

/* ============================================================
   DeepSeek V4.1 Flash AI ENTEGRASYONU
   API: https://api.deepseek.com (OpenAI uyumlu)
   ============================================================ */
var AI_KEY="pk_ai_key";
var AI_KEY_MODE_KEY="pk_ai_key_mode"; /* "device" (kalici) | "session" (sekme kapaninca silinir) */
var AI_THINK_KEY="pk_ai_think";       /* "1" = derin dusunme (thinking) acik */
/* Key okuma: once cihaz (localStorage), sonra oturum (sessionStorage).
   Hic key yoksa kullanicinin son tercih ettigi mod doner. */
function aiKeyLoad(){
  var pref="device";
  try{pref=localStorage.getItem(AI_KEY_MODE_KEY)||"device"}catch(e){}
  try{
    var dev="";
    try{dev=localStorage.getItem(AI_KEY)||""}catch(e){}
    if(dev)return{key:dev,mode:"device"};
  }catch(e){}
  try{
    var ses=sessionStorage.getItem(AI_KEY)||"";
    if(ses)return{key:ses,mode:"session"};
  }catch(e){}
  return{key:"",mode:pref==="session"?"session":"device"};
}
/* Key yazma: sadece secilen alanda tutulur, digeri temizlenir; mod tercihi hatirlanir */
function aiKeyStore(key,mode){
  var m=(mode==="session")?"session":"device";
  try{localStorage.setItem(AI_KEY_MODE_KEY,m)}catch(e){}
  try{localStorage.removeItem(AI_KEY)}catch(e){}
  try{sessionStorage.removeItem(AI_KEY)}catch(e){}
  if(!key)return true;
  try{
    if(m==="session"){sessionStorage.setItem(AI_KEY,key);return true}
    localStorage.setItem(AI_KEY,key);return true;
  }catch(e){return false}
}
var _aiKeyInit=aiKeyLoad();
var AI_CONFIG={
  provider:"deepseek",
  apiKey:_aiKeyInit.key,
  keyMode:_aiKeyInit.mode,
  endpoint:"https://api.deepseek.com/chat/completions",
  model:"deepseek-flash",
  modelLabel:"DeepSeek V4.1 Flash",
  deepThink:(function(){try{return localStorage.getItem(AI_THINK_KEY)==="1"}catch(e){return false}})(),
  timeoutMs:30000
};

function buildSystemPrompt(lang){
  if(lang==="en"){
    return "You are a personal finance advisor inside a Turkish expense-tracking app called 'Para Kontrol'. You analyze the user's past spending and income to give short, kind, motivating comments in ENGLISH.\n"+
    "CRITICAL: The user's data contains a section starting with '=== BUGUNUN VERISI (SADECE BUGUN, ...)' followed by lines like 'BUGUN_TOPLAM: X TL' and 'BUGUN_HARCAMALARI (sirasiyla):'. THIS SECTION IS THE AUTHORITATIVE TRUTH FOR TODAY'S SPENDING. If it says BUGUN_TOPLAM is non-zero and lists items, then today HAS spending. NEVER claim today is empty when this section lists items.\n"+
    "Rules:\n"+
    "- Be concise: max 4 short sentences per answer.\n"+
    "- Always look for money the user might not realize they are spending (subscriptions, small recurring charges, category spikes).\n"+
    "- When asked before a purchase, judge if it seems reasonable given their monthly budget and past behavior.\n"+
    "- Reply in plain text, no markdown, no bullet lists unless asked.\n"+
    "- If you don't know, say so honestly. Never invent numbers.";
  }
  return "Sen 'Para Kontrol' isimli Türkçe kişisel harcama takip uygulamasında çalışan bir kişisel finans danışmanısın.\n"+
  "\n"+
  "BUGUNUN VERISI (TODAY'S DATA) NASIL KONTROL EDILIR:\n"+
  "- Veri icinde '=== TODAY\\'S DATA (ONLY TODAY, ...)' bolumu var\n"+
  "- O bolumde 'TODAY_EXPENSES (count: N):' ile baslayan bir liste var\n"+
  "- Listenin altinda 'TODAY_LIST_SUM: X TL' ile toplam yaziyor\n"+
  "- Eger TODAY_LIST_SUM > 0 ise bugun HARCANMIS demektir — bos degildir\n"+
  "- 'TOPLAM sifir mi' diye SORMA. 'HARCAMALARI listesi bos mu' diye sor. Eger 'TODAY_EXPENSES (count: N)' icinde N>0 ise liste doludur, bugun harcanmis.\n"+
  "- Satir satir listeyi OKU, sadece tek bir '0' yazisina bakarak karar verme.\n"+
  "\n"+
  "Kurallar:\n"+
  "- Kisa yanit ver: en fazla 4 kisa cumle.\n"+
  "- Kullanicinin farkinda olmadigi harcamalari (abonelikler, kucuk tekrarlayan odemeler, ani kategori artislari) mutlaka belirt.\n"+
  "- Duz metin olarak yanit ver, markdown, baslik veya madde isareti KULLANMA.\n"+
  "- Bilmiyorsan acikca soyle, asla uydurma rakam yazma.";
}

async function callDeepSeekAI(messages,lang){
  if(!AI_CONFIG.apiKey){
    var msg=(lang==="en")?"API key not set. Go to Settings → DeepSeek API Key.":"API key ayarlı değil. Ayarlar → DeepSeek API Key'den ekle.";
    throw new Error(msg);
  }
  var sys=buildSystemPrompt(lang||"tr");
  var think=!!AI_CONFIG.deepThink;
  var payload={
    model:AI_CONFIG.model,
    messages:[{role:"system",content:sys}].concat(messages||[]),
    max_tokens:1024,
    stream:false,
    /* Thinking modu: kapaliyken hizli kisa yorum, acikken daha isabetli ama yavas */
    thinking:{type:think?"enabled":"disabled"}
  };
  if(think)payload.reasoning_effort="high";
  else payload.temperature=0.7; /* temperature thinking modunda yoksayilir */
  var ctl=null,timer=null;
  try{
    var opts={
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+AI_CONFIG.apiKey
      },
      body:JSON.stringify(payload)
    };
    try{
      if(typeof AbortController!=="undefined"){
        ctl=new AbortController();
        opts.signal=ctl.signal;
        timer=setTimeout(function(){try{ctl.abort()}catch(e){}},AI_CONFIG.timeoutMs||30000);
      }
    }catch(abortErr){ctl=null}
    var resp;
    try{
      resp=await fetch(AI_CONFIG.endpoint,opts);
    }catch(netErr){
      if(ctl&&netErr&&netErr.name==="AbortError"){
        throw new Error(lang==="en"?"DeepSeek request timed out. Try again.":"DeepSeek isteği zaman aşımına uğradı. Tekrar dene.");
      }
      throw new Error((lang==="en"?"Connection failed: ":"Bağlantı kurulamadı: ")+String(netErr&&netErr.message?netErr.message:netErr));
    }
    if(!resp.ok){
      var errText="";
      try{errText=await resp.text()}catch(e){}
      var detail="";
      try{
        var errObj=JSON.parse(errText);
        detail=(errObj&&errObj.error&&(errObj.error.message||errObj.error))||"";
        if(detail&&typeof detail!=="string")detail=JSON.stringify(detail);
      }catch(parseErr){detail=errText||""}
      if(resp.status===401||resp.status===403)throw new Error(lang==="en"?"DeepSeek rejected the API key (HTTP "+resp.status+"). Check it in Settings.":"DeepSeek API key'i reddetti (HTTP "+resp.status+"). Ayarlar'dan kontrol et.");
      if(resp.status===402)throw new Error(lang==="en"?"DeepSeek account balance is insufficient (HTTP 402).":"DeepSeek hesap bakiyesi yetersiz (HTTP 402).");
      if(resp.status===429)throw new Error(lang==="en"?"Too many requests (HTTP 429). Wait a moment.":"Çok fazla istek (HTTP 429). Biraz bekleyip tekrar dene.");
      throw new Error("DeepSeek HTTP "+(resp.status||"")+(detail?": "+String(detail).slice(0,200):""));
    }
    var data=await resp.json();
    var choice=data&&data.choices&&data.choices[0];
    if(choice&&choice.message){
      var answer=choice.message;
      var text=String(answer.content||"").replace(/<think>[\s\S]*?<\/think>/gi,"").trim();
      /* thinking modu: cevap bos ise akil yurutme metnini kullan */
      if(!text&&answer.reasoning_content)text=String(answer.reasoning_content).trim();
      if(text)return text;
      if(choice.finish_reason==="length")throw new Error(lang==="en"?"Response was cut off (max_tokens).":"Yanıt kesildi (max_tokens sınırı).");
      throw new Error("Boş yanıt: "+JSON.stringify(answer).slice(0,200));
    }
    if(data&&data.error)throw new Error("DeepSeek: "+String(data.error.message||JSON.stringify(data.error)).slice(0,200));
    throw new Error("Beklenmeyen yanıt formatı: "+JSON.stringify(data).slice(0,200));
  }finally{
    if(timer)clearTimeout(timer);
  }
}

/* ============================================================
   JEV — SYSTEM ONE (hizli, TIPLI karar katmani)
   ============================================================
   DeepSeek "System 2" olarak kalir: sohbet, aylik yorum, derin analiz.
   Jev  "System 1" olarak eklenir: milisaniyelik kararlar, TIPLI cikti
   (choice / noul / score + kalibre olasilik), arka plan taramalari.

   API — iki saglayici, AYNI "System One" sozlesmesi:
     OpenRouter (varsayilan): POST https://openrouter.ai/api/alpha/decisions
       Authorization: Bearer sk-or-v1-...   model: "typesafe/jev-1.13"
       (+ istege bagli atif basliklari: HTTP-Referer, X-OpenRouter-Title)
       DIKKAT: Jev bir "decisions" modelidir; chat/completions ucu REDDEDER:
         "typesafe/jev-1.13 is a decisions model and cannot be used with the
          chat/completions endpoint. Use the /api/alpha/decisions endpoint."
       Yani Jev icin DOGRU uc /api/alpha/decisions'tir (/api/v1/systemone yok).
     TypeSafe (dogrudan):     POST https://api.typesafe.ai/v1/systemone
       Authorization: Bearer <ts-key>       model: "jev-latest"
     Ortak govde:   {model, state:<nesne|metin>, questions:{...}}
     Ortak yanit:   {model, answers:{...}, usage}
     -> Metin URETMEZ, tip hatasi yapmaz. Saglayici: JEV_PROVIDERS / jevSetProvider()

   NEDEN IKI MOTOR?
   - "typesafe": gercek Jev API'si. Tur 70-500 ms ve tarayicidan yapilan
     capraz-koken istek CORS/tarayici tarafindan engellenebilir.
   - "local": tarayicida calisan deterministik System One cekirdegi.
     Ag yok -> ~0 ms. AYNI TIPLI SOZLESMEYI uretir; cagiran kod iki
     motor arasindaki farki gormez.
   Varsayilan "auto": once yerel karar ANINDA gosterilir, Jev API'si
   yanit verirse karar yukseltilir. Arayuz asla beklemez.

   ILKELER
   1) Para matematigi (butce asimi, eksik tutar, projeksiyon) HER ZAMAN
      kodda kalir. Model yalnizca yargi uretir; izni DARALTABILIR,
      asla GENISLETEMEZ.
   2) Hicbir fonksiyon throw etmez ve ham metin dondurmez; cikti her
      zaman tipli ve dogrulanmis bir nesnedir.
   3) Guven = en yuksek olasilik - 0.5 * ikinci olasilik. Bu, TypeSafe'in
      yayinladigi degerlerle ortusur (0.85/0.15->0.78 ; 0.56/0.44->0.33 ;
      1.0/0.0->1.0).
   ============================================================ */
var JEV_KEY="pk_jev_key";
var JEV_KEY_MODE_KEY="pk_jev_key_mode";   /* "device" | "session" */
var JEV_MODE_KEY="pk_jev_mode";           /* "auto" | "typesafe" | "local" */
var JEV_TRANSPORT_KEY="pk_jev_transport"; /* "direct" | "gas" */
var JEV_PROVIDER_KEY="pk_jev_provider";   /* "openrouter" | "typesafe" */
var JEV_MODEL_KEY="pk_jev_model";         /* kullanicinin sectigi model (opsiyonel) */
var JEV_MODEL_OK_KEY="pk_jev_model_ok";   /* en son BASARILI olan model (hizli yol) */
var JEV_CACHE_KEY="pk_jev_cache";         /* son cagri teshis bilgisi */

/* Saglayicilar: ikisi de AYNI "System One" sozlesmesini kullanir
   (state + questions -> tipli answers).
   - OpenRouter (varsayilan): decisions ucu /api/alpha/decisions.
     Jev bir "decisions" modelidir; /chat/completions bu modeli reddeder.
     Dogrulanan slug: "typesafe/jev-1.13" ("typesafe/jev-latest" YOK).
   - TypeSafe (dogrudan): /v1/systemone + model "jev-latest" (resmi dokuman).
   NOT: model slug'lari degisebilir; bu yuzden "modelFallbacks" sirali
   yedek listesi var ve model yoksa (400 "does not exist") otomatik gecilir. */
var JEV_PROVIDERS={
  openrouter:{
    id:"openrouter",
    label:"OpenRouter",
    endpoint:"https://openrouter.ai/api/alpha/decisions",
    model:"typesafe/jev-1.13",
    modelFallbacks:["typesafe/jev-1.13-20260917","jev-1.13"],
    keyHint:"sk-or-v1-...",
    consoleURL:"https://openrouter.ai/keys",
    modelURL:"https://openrouter.ai/models?q=jev",
    referer:"https://sbakbulut.github.io/Para-takip/",
    title:"Para Kontrol"
  },
  typesafe:{
    id:"typesafe",
    label:"TypeSafe (dogrudan)",
    endpoint:"https://api.typesafe.ai/v1/systemone",
    model:"jev-latest",
    modelFallbacks:["jev-1.13"],
    keyHint:"ts-...",
    consoleURL:"https://console.typesafe.ai/keys",
    modelURL:"https://docs.typesafe.ai",
    referer:"",
    title:""
  }
};
function jevProvider(){
  var p=JEV_CONFIG.provider;
  return JEV_PROVIDERS[p]?p:"openrouter";
}
function jevProviderConf(){return JEV_PROVIDERS[jevProvider()]}
function jevEndpoint(){return jevProviderConf().endpoint}
function jevModelId(){return JEV_CONFIG.modelOverride||jevProviderConf().model}
function jevModelLabel(){
  var c=jevProviderConf();
  return c.label+" · "+jevModelId();
}
/* Denenecek modeller: once kullanicinin sectigi, sonra hatirlanan basarili
   model, sonra saglayicinin varsayilani + yedekleri. */
function jevModelCandidates(){
  var over=String(JEV_CONFIG.modelOverride||"").trim();
  if(over)return [over];
  var list=[];
  try{var ok=localStorage.getItem(JEV_MODEL_OK_KEY)||"";if(ok)list.push(ok)}catch(e){}
  var c=jevProviderConf();
  list.push(c.model);
  (c.modelFallbacks||[]).forEach(function(m){list.push(m)});
  var seen={},out=[];
  list.forEach(function(m){
    m=String(m||"").trim();
    if(m&&!seen[m]){seen[m]=1;out.push(m)}
  });
  return out;
}
/* "Model yok" hatasi mi? (OpenRouter 400: "Model X does not exist") */
function jevIsModelMissing(status,detail,txt){
  if(status!==400&&status!==404)return false;
  return /does not exist|not a valid model|no endpoints|unknown model|model not found/i.test(String(detail||"")+" "+String(txt||""));
}

var JEV_CONFIG={
  provider:"openrouter",
  endpoint:"https://openrouter.ai/api/alpha/decisions",
  model:"typesafe/jev-1.13",
  modelLabel:"Jev (TypeSafe System One)",
  apiKey:"",
  keyMode:"device",
  engine:"auto",              /* "auto" | "typesafe" | "local" */
  transport:"direct",         /* "direct" | "gas" (Code.gs proxy) */
  modelOverride:"",           /* kullanicinin yazdigi model slug (bos = varsayilan) */
  timeoutMs:6000,             /* Jev hizli: bekleme yerine yerel karara dus */
  reviewThreshold:0.55,       /* altinda -> requiresManualReview */
  minRemoteConfidence:0.5,    /* uzak karar yerel karari ancak bu kadar eminse ezer */
  maxAnomalies:12,
  scanMinGapMs:15000          /* arka plan taramalari arasi en az sure */
};

/* --- Anahtar saklama: DeepSeek ile ayni guvenli desen (koda gomulmez) --- */
function jevKeyLoad(){
  var pref="device";
  try{pref=localStorage.getItem(JEV_KEY_MODE_KEY)||"device"}catch(e){}
  try{var dev=localStorage.getItem(JEV_KEY)||"";if(dev)return{key:dev,mode:"device"}}catch(e){}
  try{var ses=sessionStorage.getItem(JEV_KEY)||"";if(ses)return{key:ses,mode:"session"}}catch(e){}
  return{key:"",mode:pref==="session"?"session":"device"};
}
function jevKeyStore(key,mode){
  var m=(mode==="session")?"session":"device";
  try{localStorage.setItem(JEV_KEY_MODE_KEY,m)}catch(e){}
  try{localStorage.removeItem(JEV_KEY)}catch(e){}
  try{sessionStorage.removeItem(JEV_KEY)}catch(e){}
  if(!key)return true;
  try{
    if(m==="session"){sessionStorage.setItem(JEV_KEY,key);return true}
    localStorage.setItem(JEV_KEY,key);return true;
  }catch(e){return false}
}
(function(){
  var init=jevKeyLoad();
  JEV_CONFIG.apiKey=init.key;
  JEV_CONFIG.keyMode=init.mode;
  try{var m=localStorage.getItem(JEV_MODE_KEY);if(m==="auto"||m==="typesafe"||m==="local")JEV_CONFIG.engine=m}catch(e){}
  try{var tr=localStorage.getItem(JEV_TRANSPORT_KEY);if(tr==="gas"||tr==="direct")JEV_CONFIG.transport=tr}catch(e){}
  try{
    var pv=localStorage.getItem(JEV_PROVIDER_KEY);
    if(pv&&JEV_PROVIDERS[pv])JEV_CONFIG.provider=pv;
  }catch(e){}
  try{JEV_CONFIG.modelOverride=localStorage.getItem(JEV_MODEL_KEY)||""}catch(e){}
  JEV_CONFIG.endpoint=jevEndpoint();
  JEV_CONFIG.model=jevModelId();
})();

/* Hangi motor kullanilacak? Anahtar yoksa ag hic denenmez. */
function jevEngine(){
  if(JEV_CONFIG.engine==="local")return "local";
  if(!JEV_CONFIG.apiKey)return "local";
  return "typesafe";
}
function jevEngineLabel(lang){
  return (jevEngine()==="typesafe")?jevModelLabel():((lang==="tr")?"Yerel System One cekirdegi":"Local System One core");
}
/* Saglayici degistiginde endpoint/model turetilmis alanlari guncelle */
function jevSetProvider(id){
  if(!JEV_PROVIDERS[id])return;
  JEV_CONFIG.provider=id;
  JEV_CONFIG.endpoint=jevEndpoint();
  JEV_CONFIG.model=jevModelId();
  try{localStorage.setItem(JEV_PROVIDER_KEY,id)}catch(e){}
}
/* Model slug'ini elle gecersiz kil (bos = saglayici varsayilani) */
function jevSetModelOverride(slug){
  var s=String(slug||"").trim();
  var changed=(s!==String(JEV_CONFIG.modelOverride||""));
  JEV_CONFIG.modelOverride=s;
  JEV_CONFIG.model=jevModelId();
  try{
    if(s)localStorage.setItem(JEV_MODEL_KEY,s);
    else localStorage.removeItem(JEV_MODEL_KEY);
    if(changed)localStorage.removeItem(JEV_MODEL_OK_KEY);   /* slug degisti -> hatirlanan modeli sifirla */
  }catch(e){}
}
function jevCacheWrite(info){
  try{
    var prev=null;
    try{prev=JSON.parse(localStorage.getItem(JEV_CACHE_KEY)||"null")}catch(e){}
    localStorage.setItem(JEV_CACHE_KEY,JSON.stringify({
      last:info,
      lastOk:info&&info.ok?info:((prev&&prev.lastOk)?prev.lastOk:null)
    }));
  }catch(e){}
}
function jevCacheRead(){
  try{return JSON.parse(localStorage.getItem(JEV_CACHE_KEY)||"null")}catch(e){return null}
}

/* --- Tip yardimcilari + TIPLI CEVAP DOGRULAMA -------------------
   Ham API yaniti asla dogrudan kullanilmaz. Kumede olmayan secim,
   aralik disi skor, NaN/negatif olasilik -> cevap gecersiz sayilir ve
   "invalid" listesine duser. Bu fonksiyonlar asla throw etmez. */
function jevClamp01(v){
  if(v===null||typeof v==="undefined"||v==="")return null;
  var n=(typeof v==="number")?v:parseFloat(v);
  if(!isFinite(n))return null;
  return Math.max(0,Math.min(1,n));
}
/* KATI olasilik dogrulamasi: aralik disi deger GECERSIZ sayilir.
   (Kucuk kayan nokta hatasi toleransli: 1.0000001 kabul, 1.5 reddedilir.)
   Bu, "tip hatasi yapmayan" sozlesmenin korunmasini saglar. */
var JEV_PROB_EPS=1e-6;
function jevProb01(v){
  if(v===null||typeof v==="undefined"||v==="")return null;
  var n=(typeof v==="number")?v:parseFloat(v);
  if(!isFinite(n))return null;
  if(n<-JEV_PROB_EPS||n>1+JEV_PROB_EPS)return null;
  return Math.max(0,Math.min(1,n));
}
var JEV_QUESTION_TYPES={choice:1,score:1,noul:1};

function jevNormalizeAnswers(raw,asked){
  var out={},invalid=[];
  var answers=(raw&&typeof raw==="object"&&raw.answers&&typeof raw.answers==="object")?raw.answers:{};
  Object.keys(asked||{}).forEach(function(k){
    var q=asked[k]||{},a=answers[k];
    if(!a||typeof a!=="object"){invalid.push({q:k,reason:"missing"});return}
    var type=String(a.type||q.type||"");
    if(!JEV_QUESTION_TYPES[type]){invalid.push({q:k,reason:"unknown_type"});return}

    if(type==="choice"){
      var opts=Object.keys(q.criteria||{});
      var pick=String(a.choice||"");
      if(opts.length===0||opts.indexOf(pick)===-1){invalid.push({q:k,reason:"choice_out_of_set"});return}
      var probs={},bad=false,sum=0;
      opts.forEach(function(o){
        var p=jevProb01((a.probabilities||{})[o]);
        if(p===null){bad=true;return}
        probs[o]=p;sum+=p;
      });
      if(bad){invalid.push({q:k,reason:"bad_probabilities"});return}
      if(sum<=0){invalid.push({q:k,reason:"zero_probabilities"});return}
      if(Math.abs(sum-1)>0.02)opts.forEach(function(o){probs[o]=probs[o]/sum});
      var conf=jevClamp01(a.confidence);
      out[k]={type:"choice",choice:pick,confidence:(conf===null?probs[pick]:conf),probabilities:probs,valid:true,abstain:false};
      return;
    }

    if(type==="score"){
      var levels=Array.isArray(q.criteria)?q.criteria:[];
      if(levels.length===0){invalid.push({q:k,reason:"no_levels"});return}
      var sc=(typeof a.score==="number")?a.score:parseFloat(a.score);
      if(!isFinite(sc)||sc<0||sc>levels.length-1){invalid.push({q:k,reason:"score_out_of_range"});return}
      var probs2={},legend={},sum2=0,bad2=false;
      levels.forEach(function(lv,i){
        var p=jevProb01((a.probabilities||{})[String(i)]);
        if(p===null){bad2=true;return}
        probs2[String(i)]=p;sum2+=p;legend[String(i)]=String(lv);
      });
      if(bad2){invalid.push({q:k,reason:"bad_probabilities"});return}
      if(sum2>0&&Math.abs(sum2-1)>0.02)levels.forEach(function(_lv,i){probs2[String(i)]=probs2[String(i)]/sum2});
      var conf2=jevClamp01(a.confidence);
      out[k]={type:"score",score:Math.round(sc),confidence:(conf2===null?0:conf2),legend:legend,probabilities:probs2,valid:true,abstain:false};
      return;
    }

    /* noul: "evet" olasiligi (confidence opsiyoneldir) */
    var p2=jevProb01(a.noul);
    if(p2===null){invalid.push({q:k,reason:"bad_noul"});return}
    out[k]={type:"noul",noul:p2,confidence:jevClamp01(a.confidence),valid:true,abstain:false};
  });
  return {answers:out,invalid:invalid};
}

/* --- Sonuc zarfi: her cikis ayni sekilde, her zaman tipli --- */
function jevResult(engine,answers,invalid,extra){
  var r={
    ok:(invalid||[]).length===0,
    engine:engine,
    answers:answers||{},
    invalid:invalid||[],
    error:null,
    model:null,
    usage:null,
    latencyMs:0,
    generatedAt:Date.now()
  };
  if(extra)Object.keys(extra).forEach(function(k){r[k]=extra[k]});
  return r;
}
function jevFail(engine,code,message,extra){
  var r=jevResult(engine,{},[{q:"*",reason:code}],extra);
  r.ok=false;
  r.error={code:code,message:String(message||"").slice(0,240)};
  return r;
}

/* --- Guvenli ayristirma: "JSON parse hatasi" riskini kaldirir ---
   Bos/kirpik/```json sarmali/metin ici JSON -> nesne ya da null.
   Asla throw etmez, asla ham metin dondurmez. */
function jevParseLoose(text){
  if(text&&typeof text==="object")return text;
  var s=String(text===null||typeof text==="undefined"?"":text);
  if(!s)return null;
  s=s.replace(/^\uFEFF/,"").trim();
  s=s.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  if(s.charAt(0)!=="{"){
    var i=s.indexOf("{"),j=s.lastIndexOf("}");
    if(i>-1&&j>i)s=s.slice(i,j+1);
  }
  try{return JSON.parse(s)}catch(e){return null}
}

function jevNow(){
  try{if(typeof performance!=="undefined"&&performance&&typeof performance.now==="function")return performance.now()}catch(e){}
  return Date.now();
}
function jevMs(t0){var v=Math.round(jevNow()-t0);return (isFinite(v)&&v>=0)?v:0}

/* --- HTTP: TypeSafe'a dogrudan ya da Apps Script proxy'si uzerinden ---
   Proxy, Jev API'si tarayici CORS'una izin vermedigi durum icin var.
   Her iki yolda da yanit HAM METIN olarak doner; ayristirma tek yerde. */
async function jevHttp(bodyRaw){
  var ctl=null,timer=null;
  try{
    if(typeof AbortController!=="undefined"){
      ctl=new AbortController();
      timer=setTimeout(function(){try{ctl.abort()}catch(e){}},JEV_CONFIG.timeoutMs);
    }
  }catch(e){}
  try{
    if(JEV_CONFIG.transport==="gas"){
      var url="",tok="";
      try{url=localStorage.getItem("pk_drive_url")||"";tok=localStorage.getItem("pk_drive_token")||""}catch(e){}
      if(!url||!tok)throw new Error("gas_proxy_not_configured");
      var gopts={
        method:"POST",
        cache:"no-store",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"jev",token:tok,jevKey:JEV_CONFIG.apiKey,provider:jevProvider(),request:bodyRaw})
      };
      if(ctl)gopts.signal=ctl.signal;
      var gresp=await fetch(url,gopts);
      var gtext=await gresp.text();
      var gj=jevParseLoose(gtext);
      if(!gj)throw new Error("gas_bad_response");
      if(gj.ok!==true)throw new Error("gas_"+(gj.error||"error"));
      return (typeof gj.data==="string")?gj.data:JSON.stringify(gj.data);
    }

    /* Dogrudan mod. OpenRouter icin istege bagli atif basliklari eklenir
       (siralama/panel icin); islevsel degildir. */
    var pconf=jevProviderConf();
    var dheaders={"Content-Type":"application/json","Authorization":"Bearer "+JEV_CONFIG.apiKey};
    if(pconf.referer)dheaders["HTTP-Referer"]=pconf.referer;
    if(pconf.title)dheaders["X-OpenRouter-Title"]=pconf.title;
    var opts={
      method:"POST",
      cache:"no-store",
      headers:dheaders,
      body:JSON.stringify(bodyRaw)
    };
    if(ctl)opts.signal=ctl.signal;
    var resp=await fetch(jevEndpoint(),opts);
    var text=await resp.text();
    if(!resp.ok){
      var detail="";
      var eo=jevParseLoose(text);
      if(eo&&eo.error)detail=String(eo.error.message||JSON.stringify(eo.error));
      var herr=new Error("http_"+(resp.status||"")+(detail?(":"+detail.slice(0,160)):""));
      herr.jevStatus=resp.status||0;
      herr.jevDetail=String(detail||text||"").slice(0,400);
      throw herr;
    }
    return text;
  }finally{
    if(timer)clearTimeout(timer);
  }
}

/* Jev'e sor (uzak motor). Asla throw etmez: her hata tipli jevFail sonucudur.
   MODEL YEDEK ZINCIRI: slug'lar degisebildigi icin "model yok" (400) hatasinda
   siradaki adaya otomatik gecilir; basarili olan model hatirlanir. */
async function jevAskRemote(state,questions,lang){
  var t0=jevNow();
  var tr=(lang==="tr");
  var cands=jevModelCandidates();
  var tried=[];
  var lastFail=null;

  for(var ci=0;ci<cands.length;ci++){
    var model=cands[ci];
    tried.push(model);
    var r=await jevAskRemoteOnce(model,state,questions,lang,t0);
    if(r.ok){
      if(ci>0){
        /* Ilk aday olu; dogru slug'i hatirla ki her seferinde 400 yemeyelim */
        try{localStorage.setItem(JEV_MODEL_OK_KEY,model)}catch(e){}
      }
      r.modelTried=tried.slice();
      return r;
    }
    lastFail=r;
    if(r.hint==="model_not_found"&&ci<cands.length-1)continue;   /* sonrakini dene */
    break;
  }
  if(lastFail){
    lastFail.modelTried=tried.slice();
    if(tried.length>1&&lastFail.hint!=="model_not_found"){
      /* yalnizca ilk aday denendi mi bilgisini ekle */
      lastFail.modelTried=tried.slice();
    }
    return lastFail;
  }
  return jevFail("typesafe","no_candidate",tr?"Denenecek model bulunamadi.":"No model candidate to try.",{latencyMs:jevMs(t0)});
}

/* Tek deneme: bir model slug'i ile cagri + ayristirma + dogrulama. */
async function jevAskRemoteOnce(model,state,questions,lang,t0){
  var tr=(lang==="tr");
  try{
    var text=await jevHttp({model:model,state:state,questions:questions});
    var ms=jevMs(t0);
    var raw=jevParseLoose(text);
    if(!raw){
      jevCacheWrite({ok:false,engine:"typesafe",code:"bad_json",model:model,latencyMs:ms,ts:Date.now()});
      return jevFail("typesafe","bad_json",tr?"Jev yaniti okunamadi (gecersiz JSON); yerel karar kullanildi.":"Could not read Jev response (invalid JSON); local decision used.",{latencyMs:ms,hint:"json",modelUsed:model});
    }
    if(raw.error){
      var em=(raw.error&&raw.error.message)?String(raw.error.message):JSON.stringify(raw.error);
      var miss=jevIsModelMissing(400,"",em);
      jevCacheWrite({ok:false,engine:"typesafe",code:"api_error",model:model,hint:miss?"model_not_found":"api",latencyMs:ms,ts:Date.now()});
      return jevFail("typesafe","api_error",em.slice(0,200),{latencyMs:ms,hint:miss?"model_not_found":"api",modelUsed:model});
    }
    var norm=jevNormalizeAnswers(raw,questions);
    var res=jevResult("typesafe",norm.answers,norm.invalid,{latencyMs:ms,model:raw.model||null,usage:raw.usage||null,modelUsed:model,hint:"",modelTried:[model]});
    jevCacheWrite({ok:res.ok,engine:"typesafe",model:res.model||model,hint:"",latencyMs:ms,invalid:norm.invalid.length,ts:Date.now()});
    return res;
  }catch(e){
    var ms2=jevMs(t0);
    var msg=String((e&&e.message)||e||"");
    var httpStatus=(e&&e.jevStatus)||0;
    var detail=String((e&&e.jevDetail)||"").slice(0,400);
    var code=/abort/i.test(msg)?"timeout":(/gas_proxy_not_configured/.test(msg)?"gas_proxy_not_configured":(/gas_bad_response|^gas_/.test(msg)?"gas_error":(/^http_40[13]/.test(msg)?"unauthorized":(/^http_/.test(msg)?"http_error":"network"))));
    /* Tarayicida "network" hatasi neredeyse her zaman CORS/engelleme ya da
       gercek cevrimdisiliktir; ikisini ayirt etmek icin onLine'a bakilir. */
    var online=true;
    try{online=(typeof navigator==="undefined")?true:(navigator.onLine!==false)}catch(e2){}
    var hint="";
    if(code==="timeout")hint="timeout";
    else if(code==="unauthorized")hint="key";
    else if(code==="gas_proxy_not_configured"||code==="gas_error")hint="proxy";
    else if(code==="bad_json")hint="json";
    else if(code==="api_error")hint="api";
    else if(code==="http_error"&&jevIsModelMissing(httpStatus,detail,msg))hint="model_not_found";
    else if(code==="http_error")hint=(httpStatus===402)?"credits":((httpStatus===429)?"rate":"http"+(httpStatus||""));
    else hint=online?"cors_or_blocked":"offline";

    var human;
    if(hint==="model_not_found")human=tr?("Bu model slug'i OpenRouter'da yok: \""+model+"\". Ayarlar -> Jev -> Model alanindan gecerli bir slug gir."):("This model slug does not exist on OpenRouter: \""+model+"\". Enter a valid slug in Settings -> Jev -> Model.");
    else if(code==="timeout")human=tr?"Jev zaman asimina ugradi; yerel karar kullanildi.":"Jev timed out; local decision used.";
    else if(code==="gas_proxy_not_configured")human=tr?"Proxy icin once Drive Senkron ayarlarini doldur.":"Fill in Drive Sync settings first to use the proxy.";
    else if(code==="unauthorized")human=tr?"Anahtar reddedildi (401/403). Anahtar dogru hesapla olusturulmus mu?":"Key rejected (401/403). Was the key created on the right account?";
    else if(code==="gas_error")human=tr?"Proxy hatasi: "+msg.slice(0,120):"Proxy error: "+msg.slice(0,120);
    else if(code==="api_error")human=msg.slice(0,200);
    else if(code==="http_error"&&httpStatus===402)human=tr?"OpenRouter bakiyesi/limiti yetersiz (402). Panelden kredi veya anahtar limitini kontrol et.":"OpenRouter balance/limit insufficient (402). Check credits or the key limit in the dashboard.";
    else if(code==="http_error"&&httpStatus===429)human=tr?"Cok fazla istek (429). Biraz bekleyip tekrar dene.":"Too many requests (429). Wait a moment and retry.";
    else if(code==="http_error")human=msg.slice(0,200);
    else if(hint==="cors_or_blocked")human=tr?"Istek tarayicidan engellendi (CORS olabilir). Ayarlar -> Jev -> Tasima: 'Apps Script proxy' sec ve tekrar dene.":"The request was blocked by the browser (likely CORS). Set Settings -> Jev -> Transport to 'Apps Script proxy' and retry.";
    else human=tr?"Cevrimdisi gorunuyorsun; yerel karar kullanildi.":"You appear to be offline; local decision used.";

    jevCacheWrite({ok:false,engine:"typesafe",code:code,hint:hint,httpStatus:httpStatus,model:model,latencyMs:ms2,ts:Date.now()});
    return jevFail("typesafe",code,human,{latencyMs:ms2,hint:hint,httpStatus:httpStatus,detail:detail,modelUsed:model});
  }
}

/* ============================================================
   YEREL SYSTEM ONE CEKIRDEGI
   Ayni soru tiplerini ayni tipli sekilde yanitlar, ama AG YOKTUR
   (~0 ms). Bir soru icin skorlayici kayitli degilse "abstain"
   (confidence=0) doner; uydurmaz. Cagiran modul bu durumda
   deterministik koda duser.
   ============================================================ */
var JEV_SCORERS={};
function jevRegisterScorer(name,fn){JEV_SCORERS[name]=fn}

/* Logitleri olasiliga cevir + guven hesapla.
   guven = top - 0.5*ikinci  (TypeSafe'in yayinladigi degerlerle ortusur:
   0.85/0.15->0.78, 0.56/0.44->0.33, 1.0/0.0->1.0) */
function jevSoftmax(logits){
  var res={probabilities:{},best:"",top:0,second:0,confidence:0,abstain:true};
  var keys=Object.keys(logits||{});
  if(keys.length===0)return res;
  var finite=keys.filter(function(k){return typeof logits[k]==="number"&&isFinite(logits[k])});
  if(finite.length===0)return res;
  var max=-Infinity;
  finite.forEach(function(k){if(logits[k]>max)max=logits[k]});
  var sum=0,exps={};
  finite.forEach(function(k){var e=Math.exp(logits[k]-max);exps[k]=e;sum+=e});
  keys.forEach(function(k){res.probabilities[k]=(typeof exps[k]==="number")?(exps[k]/sum):0});
  keys.forEach(function(k){
    var p=res.probabilities[k];
    if(p>res.top){res.second=res.top;res.top=p;res.best=k}
    else if(p>res.second){res.second=p}
  });
  res.confidence=Math.max(0,Math.min(1,res.top-0.5*res.second));
  res.abstain=false;
  return res;
}

/* Skorlayici ham ciktisini TIPLI cevaba cevirir (uzak yanitla ayni sekil) */
function jevLocalAnswer(q,raw){
  if(!q||!JEV_QUESTION_TYPES[q.type])return null;
  var isAbstain=(raw===null||typeof raw==="undefined");

  if(q.type==="noul"){
    var p=isAbstain?null:jevClamp01((typeof raw==="number")?raw:raw.p);
    if(p===null)return {type:"noul",noul:0.5,confidence:0,valid:true,abstain:true};
    var c=(!isAbstain&&raw&&typeof raw.confidence==="number")?raw.confidence:0;
    return {type:"noul",noul:p,confidence:c,valid:true,abstain:false};
  }

  if(q.type==="choice"){
    var opts=Object.keys(q.criteria||{});
    if(opts.length===0)return null;
    var logits={};
    opts.forEach(function(o){
      var v=(!isAbstain&&raw&&raw.logits&&typeof raw.logits[o]==="number")?raw.logits[o]:null;
      logits[o]=v;
    });
    var sm=jevSoftmax(logits);
    if(sm.abstain){
      var u={};
      opts.forEach(function(o){u[o]=1/opts.length});
      return {type:"choice",choice:opts[0],confidence:0,probabilities:u,valid:true,abstain:true};
    }
    return {type:"choice",choice:sm.best,confidence:sm.confidence,probabilities:sm.probabilities,valid:true,abstain:false};
  }

  /* score */
  var levels=Array.isArray(q.criteria)?q.criteria:[];
  if(levels.length===0)return null;
  var legend={};
  levels.forEach(function(lv,i){legend[String(i)]=String(lv)});
  var logits2={};
  levels.forEach(function(_lv,i){
    var v=(!isAbstain&&raw&&raw.logits&&typeof raw.logits[String(i)]==="number")?raw.logits[String(i)]:null;
    logits2[String(i)]=v;
  });
  var sm2=jevSoftmax(logits2);
  if(sm2.abstain){
    var u2={};
    levels.forEach(function(_lv,i){u2[String(i)]=1/levels.length});
    return {type:"score",score:Math.floor((levels.length-1)/2),confidence:0,legend:legend,probabilities:u2,valid:true,abstain:true};
  }
  return {type:"score",score:parseInt(sm2.best,10)||0,confidence:sm2.confidence,legend:legend,probabilities:sm2.probabilities,valid:true,abstain:false};
}

/* Yerel yanitlar: senkron, ag yok, ~0 ms. */
function jevAskLocal(state,questions,plan,lang){
  var out={},invalid=[];
  Object.keys(questions||{}).forEach(function(k){
    var q=questions[k];
    if(!q||!JEV_QUESTION_TYPES[q.type]){invalid.push({q:k,reason:"bad_question"});return}
    var name=plan?plan[k]:null;
    var fn=name?JEV_SCORERS[name]:null;
    var raw=null;
    if(typeof fn==="function"){
      try{raw=fn(state,q,lang||"tr")}catch(e){raw=null}
    }
    var a=jevLocalAnswer(q,raw);
    if(!a){invalid.push({q:k,reason:"no_local_answer"});return}
    if(a.abstain)invalid.push({q:k,reason:"abstain"});
    out[k]=a;
  });
  return jevResult("local",out,invalid,{latencyMs:0,model:"local-system-one"});
}

/* ANA GIRIS NOKTASI
   - onEarly(localResult): SENKRON cagrilir -> arayuz aninda karar alir.
   - donus: yerel sonuc, ya da Jev API'si daha iyi yanit verdiginde uzak sonuc.
   Hata/gecikme durumunda her zaman yerel sonuca duser. */
async function jevAsk(opts){
  var state=opts.state,questions=opts.questions,plan=opts.plan,lang=opts.lang||"tr";
  var local=jevAskLocal(state,questions,plan,lang);
  if(typeof opts.onEarly==="function"){try{opts.onEarly(local)}catch(e){}}
  if(jevEngine()!=="typesafe"||opts.remote===false)return local;
  var remote=await jevAskRemote(state,questions,lang);
  if(!remote||!remote.ok)return local;
  return remote;
}

/* ============================================================
   MODUL 2'nin veri katmani: TURKCE METIN NORMALIZASYONU + SOZLUK
   Amac: serbest metni tipli kategori secimine cevirmek.
   Kural tabanli sozluk + kullanicinin KENDI gecmisi = kisisel prior.
   ============================================================ */
/* Turkce'ye duyarli normalizasyon: aksan/ek sorunlarini azaltir.
   NFD ayristirma + birlesik isaretleri at -> "İ" bilesenine ayrilip
   "i" olur (en-US locale'de bile tek harf kalir). */
function jevNorm(s){
  var t=String(s===null||typeof s==="undefined"?"":s);
  try{if(t.normalize)t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}catch(e){}
  try{t=t.toLocaleLowerCase("tr-TR")}catch(e){t=t.toLowerCase()}
  return t.replace(/ı/g,"i").replace(/İ/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
          .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c")
          .replace(/[^a-z0-9]+/g," ").replace(/^ +| +$/g,"");
}
var JEV_STOP={"ve":1,"ile":1,"bir":1,"bu":1,"icin":1,"aldik":1,"aldim":1,"aldi":1,"alindi":1,
  "yaptim":1,"yaptik":1,"odeme":0,"gittim":1,"geldi":1,"olan":1,"daha":1,"cok":1,"az":1,
  "tl":1,"try":1,"lira":1,"tane":1,"adet":1,"kadar":1,"sonra":1,"yeni":1,"ilk":1,"bugun":1,
  "the":1,"for":1,"and":1,"with":1,"from":1};
function jevTokens(s){
  var norm=jevNorm(s);
  if(!norm)return [];
  return norm.split(" ").filter(function(t){return t.length>=3&&!JEV_STOP[t]});
}

/* Kategori anahtar sozlugu: "*" isaretli olanlar marka/guclu sinyaldir.
   Anahtarlar varsayilan kategori id'leriyle aynidir; kullanici kendi
   kategorisini eklerse eslesme kategori etiketi uzerinden de yapilir. */
var JEV_LEX={
  market:"*migros *a101 *bim *sok *carrefour *sokmarket *metro *macrocenter *getir market supermarket manav kasap sebze meyve ekmek sut yumurta peynir zeytin makarna pirinc yag deterjan temizlik kagit havlu bakliyat kola cips biskuvi kahvaltilik konserve dondurulmus salca un seker cay kahve",
  yemek:"*yemeksepeti *mcdonalds *burger *starbucks *dominos *pizza *kfc lokanta restoran kafe kahve cay corba doner kebap pide lahmacun tost simit borek tatl tatli pastane buf agiz yemek ogle aksam yemegi",
  ulasim:"*istanbulkart *ankarakart *shell *opet *petrol *bp *total benzin motorin mazot yakit otobus metro metrobus tramvay taksi uber bitaksi dolmus bilet otopark kopru otoyol hgs ogs servis ucus ucak tren",
  fatura:"*elektrik *dogalgaz *dogal *su *internet *turkcell *vodafone *turk *telekom fatura abonelik sayac endeks dogalgaz kwh kw elektrik su dogal gaz telefon fatura odeme aidat",
  kira:"*kira kiraya ev kiralik apart daire konut mulk emlak aidat site yonetim",
  abonelik:"*netflix *spotify *youtube *exxen *blutv *disney *amazon *apple *icloud *google *microsoft abonelik subscription uyelik aylik paket premium dergi gazete platform",
  saglik:"*eczane *hastane *klinik *optik *medikal eczane ilac recete doktor muayene dis saglik tahlil laboratuvar vitamin takviye maske termometre fizyoterapi psikolog",
  giyim:"*trendyol *hepsiburada *zara *lcw *koton *mavi *adidas *nike *boyner *defacto tisort gomlek pantolon ayakkabi ceket mont kazak corap camasir elbise etek kaban bot kiyafet giyim",
  eglence:"*sinema *cinemaximum *biletix *biletinial *steam *playstation *xbox *nintendo sinema konser tiyatro festival oyun oyunu playstation kutu oyunu muzik album bar alkol bira sarap raki gezi tatil muze lunapark eglence",
  krediodeme:"*kredi *bank *ziraat *garanti *isbank *akbank *yapikredi *vakif *halk *qnb *teb taksit kredi karti ekstre borclanma faiz anapara odeme aidat",
  nakitavans:"*avans *nakit nakit avans cekim atm limit komisyon gecikme",
  diger:"diger cesitli muhtelif belirsiz extra ekstra"
};

/* Sozluk indeksi: bir kez ayristirilir (her cagride split maliyeti olmasin) */
var JEV_LEX_INDEX=(function(){
  var idx={};
  Object.keys(JEV_LEX).forEach(function(cat){
    var list=[];
    String(JEV_LEX[cat]).split(" ").forEach(function(p){
      if(!p)return;
      var strong=(p.charAt(0)==="*");
      var kw=jevNorm(strong?p.slice(1):p);
      if(kw)list.push({kw:kw,w:strong?1.8:1.0});
    });
    idx[cat]=list;
  });
  return idx;
})();

/* Serbest metinden tutar ve not cikarma — MODEL DEGIL, SAF KOD.
   "Trendyol'dan kulaklik aldik, 1200 TL" -> {amount:1200, note:"Trendyol'dan kulaklik"}
   Turkce biçimler: "1.200,50 TL", "1200tl", "₺1.200", "1200 lira". */
var JEV_CUR_RE=/(?:tl|try|lira|₺)/i;
function s_textSafe(v){return (v===null||typeof v==="undefined")?"":String(v)}
function jevExtractAmount(text){
  var s=s_textSafe(text);
  var re=/\d[\d.,]*/g,m,best=null,last=null;
  while((m=re.exec(s))!==null){
    var raw=m[0].replace(/[.,]+$/,"");
    if(!raw)continue;
    var v=parseNum(raw);
    if(!isFinite(v)||v<=0)continue;
    var after=s.slice(re.lastIndex,re.lastIndex+12);
    var before=s.slice(Math.max(0,m.index-2),m.index);
    /* yil / adet / tarih gibi sayilari ele */
    if(/^\s*(adet|tane|kisi|gun|ay)\b/i.test(after))continue;
    if(/^\d{1,2}[./]\d{1,2}[./]\d{2,4}/.test(raw))continue;
    var cur=(JEV_CUR_RE.test(after)||JEV_CUR_RE.test(before));
    var cand={value:v,index:m.index,raw:raw,currency:cur};
    last=cand;
    if(cur){best=cand;break}
  }
  return (best||last)||null;
}
/* Tutar ve para birimi kelimelerini nottan temizle */
function jevCleanNote(text,amountInfo){
  var s=String(s_textSafe(text));
  if(amountInfo){
    var i=s.indexOf(amountInfo.raw);
    if(i>-1)s=s.slice(0,i)+" "+s.slice(i+amountInfo.raw.length);
  }
  s=s.replace(/(?:^|\s)[₺]?\s*(?:tl|try|lira)\b/gi," ");
  s=s.replace(/\s*[₺]\s*/g," ");
  s=s.replace(/\b(?:fiyat[ıi]?|tutar[ıi]?|toplam)\b/gi," ");
  s=s.replace(/^[\s,;:\-–—.]+|[\s,;:\-–—.]+$/g,"");
  s=s.replace(/\s{2,}/g," ");
  s=s.replace(/^[,;:\-–—]\s*/,"");
  return s.slice(0,200).trim();
}

/* ============================================================
   MODUL 2 — AKILLI VE HIZLI ISLEM KATEGORIZASYONU
   Giris : serbest metin ("Trendyol'dan kulaklik aldik, 1200 TL")
   Cikis : TIPLI {category, confidence, requiresManualReview, amount, note}
   Yaklasim: log-oncelik (kisisel gecmis) + log-olabilirlik (sozluk,
   ek toleransli onek eslesmesi). JSON ayristirma YOK; cikti hep nesne.
   ============================================================ */
/* Kullanicinin kendi gecmisinden kategori onceligi + token->kategori ipucu */
function jevHistoryStats(expenses,cats){
  var cut=Date.now()-90*24*60*60*1000,share={},pairs={},tot=0;
  (cats||[]).forEach(function(c){share[c.id]=0});
  (expenses||[]).forEach(function(e){
    if(!e||!e.category||share[e.category]===undefined)return;
    var ts=Date.parse(e.date||"");
    if(!isNaN(ts)&&ts<cut)return;
    share[e.category]+=(+e.amount||0);tot+=(+e.amount||0);
    jevTokens(e.note||"").forEach(function(tk){
      if(!pairs[tk])pairs[tk]={};
      pairs[tk][e.category]=(pairs[tk][e.category]||0)+1;
    });
  });
  var prior={};
  (cats||[]).forEach(function(c){prior[c.id]=tot>0?(share[c.id]/tot):(1/Math.max(1,cats.length))});
  return {prior:prior,pairs:pairs,share:share,total:tot};
}

/* Kategori logitleri: log(oncelik) + sozluk kaniti + gecmis kaniti
   Oncelik kutlesi 0.85 / 0.15 bolunur: %15 "harcama degil" secenegine
   ayrilir. Boylece hicbir kanit yokken model "belirsiz" der, rastgele
   bir kategori secmez. */
var JEV_PRIOR_MASS=0.85;
function jevCategoryLogits(state){
  var cats=state.cats||[],tokens=state.tokens||[],hist=state.hist||{prior:{},pairs:{}};
  var logits={},anyEvidence=false;
  cats.forEach(function(c){
    var pr=(hist.prior&&typeof hist.prior[c.id]==="number")?hist.prior[c.id]:(1/Math.max(1,cats.length));
    var score=Math.log(Math.max(pr*JEV_PRIOR_MASS,0.002));
    var evidence=0;
    var list=JEV_LEX_INDEX[c.id];
    if(list&&tokens.length){
      for(var i=0;i<tokens.length;i++){
        var tk=tokens[i];
        for(var j=0;j<list.length;j++){
          var kw=list[j].kw,w=list[j].w;
          if(tk===kw)evidence+=2.2*w;
          else if(kw.length>=4&&tk.indexOf(kw)===0)evidence+=1.8*w;   /* marketten ~ market */
          else if(tk.length>=4&&kw.indexOf(tk)===0)evidence+=1.4*w;   /* market ~ markette  */
        }
      }
    }
    var lbl=jevNorm(c.label||"");
    if(lbl){
      tokens.forEach(function(t){
        if(t===lbl)evidence+=2.6;
        else if(lbl.length>=4&&t.indexOf(lbl)===0)evidence+=1.6;
      });
    }
    if(hist.pairs&&tokens.length){
      var best=0;
      tokens.forEach(function(t){
        var p=hist.pairs[t];
        if(p&&p[c.id])best=Math.max(best,Math.min(3,p[c.id]));
      });
      evidence+=1.2*best;
    }
    if(evidence>0)anyEvidence=true;
    logits[c.id]=score+evidence;
  });
  /* "harcama degil" tabani; hic kanit yoksa acikca one gecer */
  logits.__none__=Math.log(0.15)+(anyEvidence?0:2.0);
  return logits;
}

jevRegisterScorer("catPick",function(state){return {logits:jevCategoryLogits(state)}});
jevRegisterScorer("catReview",function(state){
  /* Birden fazla kategori one cikiyorsa ya da hic kanit yoksa "review" olasiligi artar */
  var lg=jevCategoryLogits(state);
  var keys=Object.keys(lg).filter(function(k){return k!=="__none__"});
  keys.sort(function(a,b){return lg[b]-lg[a]});
  var top=lg[keys[0]],second=(keys.length>1?lg[keys[1]]:top);
  var p=1/(1+Math.exp((top-second)-0.9));
  if(top<=Math.log(0.13))p=Math.max(p,0.8);
  return {p:Math.round(p*1000)/1000};
});

function jevCategoryQuestions(cats,lang){
  var tr=(lang==="tr");
  var criteria={};
  (cats||[]).forEach(function(c){criteria[c.id]=(c.icon?c.icon+" ":"")+c.label});
  criteria.__none__=tr?"Harcama degil / alakasiz metin":"Not an expense / unrelated text";
  return {
    category:{
      type:"choice",
      instructions:{
        question:tr?"Bu metin hangi harcama kategorisine ait?":"Which spending category does this text belong to?",
        focus:tr?"Isletme/urun adlarina ve harcama turune bak; tutar ve tarih kategoriyi belirlemez.":"Look at merchant/product names and the type of spending; amounts and dates do not decide the category."
      },
      criteria:criteria
    },
    needs_review:{
      type:"noul",
      instructions:tr?"Metin birden fazla kategoriye uyuyor ya da kategori belirsiz":"The text fits several categories or the category is ambiguous"
    }
  };
}
var JEV_LOCAL_PLAN_CAT={category:"catPick",needs_review:"catReview"};

/* TIPLI SONUC birlestirici: model yargisi + kod gercekleri.
   {ok, category, confidence, requiresManualReview, amount, note, alternatives, engine} */
function jevCategorizeCompose(text,cats,res,lang,amountInfo){
  var tr=(lang==="tr");
  var out={
    ok:true,
    text:s_textSafe(text),
    category:null,
    confidence:0,
    requiresManualReview:true,
    amount:(amountInfo?amountInfo.value:null),
    amountRaw:(amountInfo?amountInfo.raw:null),
    note:jevCleanNote(text,amountInfo),
    alternatives:[],
    engine:(res?res.engine:"local"),
    latencyMs:(res?res.latencyMs:0),
    error:null
  };
  var pick=(res&&res.answers)?res.answers.category:null;
  if(!pick||pick.abstain||pick.confidence<=0){
    /* Cekirdek/model karar veremedi: uydurmak yerine kullaniciya sor */
    out.error=tr?"Kategori icin guvenilir karar yok; sen sec.":"No confident category decision; please choose.";
    return out;
  }
  var probs=pick.probabilities||{};
  var ranked=Object.keys(probs).map(function(k){return{k:k,p:probs[k]}}).sort(function(a,b){return b.p-a.p});
  out.alternatives=ranked.slice(0,3).map(function(r){
    return {category:(r.k==="__none__"?null:r.k),probability:Math.round(r.p*1000)/1000};
  });
  var review=(res&&res.answers)?res.answers.needs_review:null;
  var reviewP=(review&&!review.abstain)?review.noul:0.5;

  if(pick.choice==="__none__"){
    out.confidence=pick.confidence;
    out.error=tr?"Metin bir harcama gibi gorunmuyor.":"This text does not look like an expense.";
    return out;
  }
  out.category=pick.choice;
  out.confidence=pick.confidence;
  var second=(out.alternatives.length>1?out.alternatives[1].probability:0);
  var topP=probs[pick.choice]||0;
  out.requiresManualReview=(
    pick.confidence<JEV_CONFIG.reviewThreshold ||
    reviewP>=0.6 ||
    (topP>0&&second/topP>0.75)
  );
  return out;
}

/* Senkron (aninda, agsiz) kategori onerisi — yerel cekirdek.
   Arayuz bunu render icinde cagirabilir; bekleme yoktur. */
function jevCategorizeLocal(text,cats,hist,lang){
  var amountInfo=jevExtractAmount(text);
  var state={text:s_textSafe(text),tokens:jevTokens(text),cats:cats||[],hist:hist||{prior:{},pairs:{}}};
  var questions=jevCategoryQuestions(cats,lang);
  var res=jevAskLocal(state,questions,JEV_LOCAL_PLAN_CAT,lang);
  return jevCategorizeCompose(text,cats,res,lang,amountInfo);
}

/* Asenkron surum: yerel sonucu ANINDA dondurur, sonra Jev API'si
   daha emin bir karar verirse onu kullanir. Hata halinde yerel kalir. */
async function jevCategorize(text,cats,hist,lang){
  var amountInfo=jevExtractAmount(text);
  var state={text:s_textSafe(text),tokens:jevTokens(text),cats:cats||[],hist:hist||{prior:{},pairs:{}}};
  var questions=jevCategoryQuestions(cats,lang);
  var res=await jevAsk({
    state:state,
    questions:questions,
    plan:JEV_LOCAL_PLAN_CAT,
    lang:lang,
    onEarly:null
  });
  return jevCategorizeCompose(text,cats,res,lang,amountInfo);
}

/* ============================================================
   MODUL 1 — ANLIK HARCAMA RISK KAPISI (Pre-Check / Triage)
   Kullanici "Ekle" dedigi anda DeepSeek BEKLENMEZ; bu katman
   TIpli {isAllowed, riskLevel, deficitAmount} uretir.
   - Para matematigi kodda: deficit, ratio, projeksiyon.
   - Model yalnizca YARGI uretir ve riski yukseltebilir (izin daralir).
     Butce yoksa model karari en fazla "strain" olur (gereksiz blok yok).
   ============================================================ */
var JEV_RISK_LEVELS=["safe","watch","strain","breach"];
function jevRiskIdx(lv){var i=JEV_RISK_LEVELS.indexOf(lv);return i<0?0:i}
function jevRiskMax(a,b){return jevRiskIdx(a)>=jevRiskIdx(b)?a:b}

var JEV_KW_REPEAT=["taksit","aidat","abonelik","her ay","aylik","kira","fatura","senet","vade","otomatik odeme","yenileme"];
var JEV_KW_ESSENTIAL=["market","gida","ekmek","sut","yumurta","ilac","eczane","kira","fatura","elektrik","su","dogalgaz","internet","ulasim","benzin","otobus","okul","kitap","bebek","mama","kirtasiye"];
var JEV_KW_LUXURY=["tatil","oyun","konser","sinema","hediye","lüks","alkol","sigara","kumar","takı","mücevher","abonelik"];
function jevKeywordHits(text,list){
  var n=jevNorm(text);
  if(!n)return 0;
  var hits=0;
  (list||[]).forEach(function(k){
    var kk=jevNorm(k);
    if(kk&&n.indexOf(kk)!==-1)hits++;
  });
  return hits;
}

/* Kapinin yapisal durumu (Jev'e gonderilen "state") */
function jevGateState(input){
  var amount=+input.amount||0;
  var budget=+input.budget||0;
  var spent=+input.spent||0;
  var after=spent+amount;
  var deficit=budget>0?Math.max(0,after-budget):0;
  var ratio=budget>0?(after/budget):0;
  var dom=Math.max(1,+input.dayOfMonth||1);
  var dim=Math.max(1,+input.daysInMonth||30);
  var rem=Math.max(0,dim-dom);
  var dailyRate=dom>0?(spent/dom):0;
  var projected=budget>0?Math.round(after+dailyRate*rem):0;
  var incRatio=(+input.monthIncome>0)?(amount/(+input.monthIncome)):0;
  return {
    amount:Math.round(amount*100)/100,
    category:input.catLabel||input.categoryId||"",
    note:String(s_textSafe(input.note)).slice(0,120),
    budget:Math.round(budget*100)/100,
    spentThisMonth:Math.round(spent*100)/100,
    spentAfter:Math.round(after*100)/100,
    deficit:Math.round(deficit*100)/100,
    budgetUsedRatio:Math.round(ratio*1000)/1000,
    dayOfMonth:dom,
    daysInMonth:dim,
    projectedMonthEnd:projected,
    monthIncome:Math.round((+input.monthIncome||0)*100)/100,
    monthExpense:Math.round((+input.monthExpense||0)*100)/100,
    amountToIncomeRatio:Math.round(incRatio*1000)/1000,
    prevMonthSameCategory:Math.round((+input.prevMonthSpent||0)*100)/100,
    repeatWords:jevKeywordHits(input.note,JEV_KW_REPEAT),
    essentialWords:jevKeywordHits(input.note,JEV_KW_ESSENTIAL),
    luxuryWords:jevKeywordHits(input.note,JEV_KW_LUXURY)
  };
}

/* --- Yerel skorlayicilar (hepsi SAF MATEMATIK, uydurma yok) --- */
jevRegisterScorer("gateBudgetFit",function(st){
  var p;
  if(st.budget>0){
    var r=st.budgetUsedRatio;
    /* r=0.92 -> 0.5 ; r>=1.02 -> ~0.1 ; r<=0.6 -> ~0.95 */
    p=1/(1+Math.exp((r-0.92)/0.10));
  }else{
    /* Butce tanimli degil: aylik gelire oranla */
    p=st.amountToIncomeRatio<=0.05?0.92:(st.amountToIncomeRatio<=0.12?0.65:0.35);
    if(st.amountToIncomeRatio<=0)p=0.85;
  }
  if(st.repeatWords>0)p-=0.12;                 /* tekrarlayan -> butceyi daha cok zorlar */
  if(st.essentialWords>0)p+=0.10;
  if(st.luxuryWords>0)p-=0.08;
  return {p:Math.max(0.02,Math.min(0.98,Math.round(p*1000)/1000))};
});
jevRegisterScorer("gateRisk",function(st){
  var logits;
  if(st.budget>0){
    var r=st.budgetUsedRatio;
    logits={
      safe:2.2*(0.95-r),
      watch:2.2*(1-Math.abs(r-0.74)/0.26),
      strain:2.4*(1-Math.abs(r-0.95)/0.17),
      breach:3.0*(r-1.0)
    };
  }else{
    var i=st.amountToIncomeRatio;
    logits={
      safe:2.0*(0.08-i)*10,
      watch:1.8*(1-Math.abs(i-0.06)/0.06),
      strain:2.0*(1-Math.abs(i-0.14)/0.10),
      breach:-1.2
    };
  }
  if(st.essentialWords>0){logits.safe+=0.35;logits.breach-=0.25}
  if(st.luxuryWords>0){logits.watch+=0.3;logits.strain+=0.2}
  return {logits:logits};
});
jevRegisterScorer("gateRepeat",function(st){
  var p=0.06;
  if(st.repeatWords>0)p+=0.45+0.12*Math.min(3,st.repeatWords);
  if(st.prevMonthSameCategory>0&&st.amount>0){
    /* Gecen ay ayni kategoride benzer tutar varsa tekrar olasiligi artar */
    var sim=1-Math.min(1,Math.abs(st.prevMonthSameCategory-st.amount)/Math.max(st.amount,st.prevMonthSameCategory,1));
    p+=0.35*sim;
  }
  return {p:Math.max(0.02,Math.min(0.97,Math.round(p*1000)/1000))};
});
jevRegisterScorer("gateEssential",function(st){
  var p=0.35;
  p+=0.22*Math.min(3,st.essentialWords);
  p-=0.25*Math.min(3,st.luxuryWords);
  return {p:Math.max(0.03,Math.min(0.97,Math.round(p*1000)/1000))};
});
var JEV_LOCAL_PLAN_GATE={budget_fit:"gateBudgetFit",risk_class:"gateRisk",repeat_risk:"gateRepeat",essential:"gateEssential"};

/* Risk kapisinin soru seti — Jev'e gonderilen tek istek, 4 tipLI soru */
function jevGateQuestions(lang){
  var tr=(lang==="tr");
  return {
    budget_fit:{
      type:"noul",
      instructions:tr?"state.amount tutarindaki bu harcama, state.budget butcesini asmadan karsilanabilir":"This expense of state.amount fits within state.budget without exceeding it"
    },
    risk_class:{
      type:"choice",
      instructions:{
        question:tr?"Bu harcamanin butce riski hangi sinifta?":"Which risk class does this expense fall into?",
        focus:tr?"state.budgetUsedRatio, state.deficit ve state.projectedMonthEnd alanlarina bak.":"Look at state.budgetUsedRatio, state.deficit and state.projectedMonthEnd."
      },
      criteria:{
        safe:tr?"Butce rahat; sorun yok":"Budget is comfortable; no concern",
        watch:tr?"Butce icinde ama takip edilmeli":"Within budget but worth watching",
        strain:tr?"Butceyi zorluyor; ay sonu riskli":"Straining the budget; month-end looks risky",
        breach:tr?"Butce asiliyor":"Budget is exceeded"
      }
    },
    repeat_risk:{
      type:"noul",
      instructions:tr?"Bu harcamanin tekrarlayan bir odeme olmasi muhtemel (taksit, aidat, abonelik vb.)":"This expense is likely a recurring payment (installment, dues, subscription, etc.)"
    },
    essential:{
      type:"noul",
      instructions:tr?"Bu harcama zorunlu/temel bir ihtiyac (market, ilac, kira, fatura, ulasim)":"This expense is a necessary/essential need (groceries, medicine, rent, bills, transport)"
    }
  };
}

/* ============================================================
   TIPLI KAPI KARARI
   Donen nesne (arayuzun bekledigi sozlesme):
   {ok, isAllowed, riskLevel, deficitAmount, confidence, source,
    reasons[], projectedMonthEnd, repeatRisk, essential, engine, latencyMs}
   ============================================================ */
function jevComposeGateVerdict(input,res,lang){
  var st=jevGateState(input);
  var out={
    ok:true,
    isAllowed:true,
    riskLevel:"safe",
    deficitAmount:st.deficit,
    confidence:0,
    source:"code",
    reasons:[],
    projectedMonthEnd:st.projectedMonthEnd,
    repeatRisk:null,
    essential:null,
    amount:st.amount,
    budget:st.budget,
    spentAfter:st.spentAfter,
    budgetUsedRatio:st.budgetUsedRatio,
    engine:(res?res.engine:"local"),
    latencyMs:(res?res.latencyMs:0),
    error:null
  };

  /* --- 1) KOD KARARI: para gercekleri --- */
  var codeLevel;
  if(st.budget>0){
    if(st.deficit>0)codeLevel="breach";
    else if(st.budgetUsedRatio>=0.9)codeLevel="strain";
    else if(st.budgetUsedRatio>=0.72)codeLevel="watch";
    else codeLevel="safe";
  }else{
    if(st.amountToIncomeRatio>=0.15)codeLevel="strain";
    else if(st.amountToIncomeRatio>=0.07)codeLevel="watch";
    else codeLevel="safe";
  }

  /* --- 2) MODEL YARGISI: yalnizca riski YUKSELTEBILIR --- */
  var A=(res&&res.answers)||{};
  var riskAns=A.risk_class, fitAns=A.budget_fit, repAns=A.repeat_risk, essAns=A.essential;
  var modelLevel=null,modelConf=0;
  if(riskAns&&!riskAns.abstain&&riskAns.confidence>0){
    modelLevel=riskAns.choice;modelConf=riskAns.confidence;
    if(st.budget<=0&&modelLevel==="breach")modelLevel="strain";  /* butce yoksa blok yok */
  }
  var finalLevel=codeLevel;
  if(modelLevel&&modelConf>=0.2){
    finalLevel=jevRiskMax(codeLevel,modelLevel);
  }
  out.riskLevel=finalLevel;
  out.confidence=modelConf>0?Math.min(1,modelConf):0;
  if(modelLevel)out.source=out.engine;

  /* --- 3) SEBEP KODLARI (arayuz bunlari yerellestirir) --- */
  if(st.budget<=0)out.reasons.push("no_budget");
  if(st.deficit>0)out.reasons.push("over_budget");
  else if(st.budget>0&&st.budgetUsedRatio>=0.9)out.reasons.push("near_limit");
  if(st.budget>0&&st.projectedMonthEnd>st.budget)out.reasons.push("projection_over");
  if(fitAns&&!fitAns.abstain&&fitAns.noul<0.3&&st.budget>0)out.reasons.push("model_veto");
  if(repAns&&!repAns.abstain&&repAns.noul>=0.6){out.reasons.push("likely_recurring");out.repeatRisk=repAns.noul}
  if(essAns&&!essAns.abstain){out.essential=essAns.noul;if(essAns.noul<0.3)out.reasons.push("non_essential")}

  /* --- 4) IZIN: yalnizca DARALTILIR --- */
  out.isAllowed=(out.riskLevel!=="breach");
  if(out.reasons.indexOf("model_veto")!==-1)out.isAllowed=false;

  /* Kaynak etiketi: model yargisi yoksa karar tamamen koddan gelmistir */
  if(!modelLevel||modelConf<=0)out.source="code";
  out.ok=true;
  return out;
}

/* Senkron (aninda) kapi karari: ag yok, bekleme yok -> "Ekle" aninda uyari.
   Arayuz bunu render icinde cagirir; hicbir Promise beklenmez. */
function jevRiskGateSync(input,lang){
  var state=jevGateState(input);
  var questions=jevGateQuestions(lang);
  var res=jevAskLocal(state,questions,JEV_LOCAL_PLAN_GATE,lang);
  return jevComposeGateVerdict(input,res,lang);
}

/* Asenkron kapi: once yerel karari ANINDA verir (onEarly), Jev API'si
   daha iyi bir yargi dondururse onu kullanir (onFinal). */
async function jevRiskGate(input,lang,onEarly,onFinal){
  var state=jevGateState(input);
  var questions=jevGateQuestions(lang);
  var res=await jevAsk({
    state:state,
    questions:questions,
    plan:JEV_LOCAL_PLAN_GATE,
    lang:lang,
    onEarly:function(localRes){
      if(typeof onEarly==="function")onEarly(jevComposeGateVerdict(input,localRes,lang));
    }
  });
  var verdict=jevComposeGateVerdict(input,res,lang);
  if(typeof onFinal==="function")onFinal(verdict);
  return verdict;
}

/* ============================================================
   MODUL 3 — ARKA PLAN BUTCE ANOMALI TARAMASI (Background Watcher)
   Hafif, saf JS olasilik testleri. Ag yok, DeepSeek yok, ~1 ms.
   Testler: degistirilmis z (MAD), Poisson kuyruk, Wilson ust sinir,
   Welch t (iki ornek), log-normal tek tutar sapmasi.
   ============================================================ */
/* Gauss hata fonksiyonu (Abramowitz-Stegun 7.1.26, ~1e-7 hata) */
function jevErr(x){
  var s=(x<0)?-1:1;
  x=Math.abs(x);
  var t=1/(1+0.3275911*x);
  var y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
function jevNormCdf(z){return 0.5*(1+jevErr(z/Math.SQRT2))}
function jevNormSf(z){return 1-jevNormCdf(z)}          /* P(Z > z) */

function jevSum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s}
function jevMean(a){return a.length?jevSum(a)/a.length:0}
function jevVariance(a,m){
  if(a.length<2)return 0;
  m=(typeof m==="number")?m:jevMean(a);
  var s=0;
  for(var i=0;i<a.length;i++){var d=a[i]-m;s+=d*d}
  return s/(a.length-1);
}
function jevStd(a){return Math.sqrt(jevVariance(a))}
function jevMedian(a){
  if(!a.length)return 0;
  var b=a.slice().sort(function(x,y){return x-y});
  var mid=Math.floor(b.length/2);
  return b.length%2?b[mid]:(b[mid-1]+b[mid])/2;
}
/* MAD = medyan mutlak sapma; aykiri degerlere karsi dayaniklidir */
function jevMad(a){
  if(!a.length)return 0;
  var m=jevMedian(a),dev=[];
  for(var i=0;i<a.length;i++)dev.push(Math.abs(a[i]-m));
  return jevMedian(dev);
}
/* Degistirilmis z skoru: 0.6745*(x-medyan)/MAD  (|z|>3.5 = aykiri)
   MAD = 0 ise (degerlerin cogu ayni) Iglewicz & Hoaglin onerisiyle
   sigma ~ 1.253 * ortalama mutlak sapma kullanilir; aksi halde
   "hep ayni tutar, bir gun dev tutar" deseni yakalanmaz. */
function jevModifiedZ(values,x){
  if(!values||values.length<4)return 0;
  var m=jevMedian(values),mad=jevMad(values);
  if(mad>1e-9)return 0.6745*(x-m)/mad;
  var sum=0;
  for(var i=0;i<values.length;i++)sum+=Math.abs(values[i]-m);
  var meanAD=sum/values.length;
  if(meanAD>1e-9)return (x-m)/(1.253*meanAD);
  return 0;
}
/* log(i!) — Poisson pmf'ini tasmasin diye log uzayinda */
function jevLogFact(n){
  var s=0;
  for(var i=2;i<=n;i++)s+=Math.log(i);
  return s;
}
/* P(X >= k), X ~ Poisson(lambda) — "bugun cok fazla islem" testi */
function jevPoissonTailGe(k,lambda){
  if(!(lambda>0))return (k<=0)?1:0;
  k=Math.max(0,Math.round(k));
  if(k<=0)return 1;
  if(lambda>60){
    var z=(k-0.5-lambda)/Math.sqrt(lambda);           /* sureklilik duzeltmesi */
    return Math.max(0,Math.min(1,jevNormSf(z)));
  }
  var cum=0,lf=0;
  for(var i=0;i<k;i++){
    if(i>0)lf+=Math.log(i);
    cum+=Math.exp(i*Math.log(lambda)-lambda-lf);
  }
  return Math.max(0,Math.min(1,1-cum));
}
/* Wilson ust sinir: az sayida gozlemde oran tahmini icin guvenilir */
function jevWilsonUpper(k,n,z){
  if(n<=0)return 1;
  z=(typeof z==="number")?z:1.645;                    /* %95 tek yonlu */
  var p=k/n,z2=z*z;
  return (p+z2/(2*n)+z*Math.sqrt(p*(1-p)/n+z2/(4*n*n)))/(1+z2/n);
}
/* Welch t testi (esit olmayan varyans) — ay-ay sapma testi */
function jevWelch(a,b){
  var na=a.length,nb=b.length;
  if(na<2||nb<2)return null;
  var ma=jevMean(a),mb=jevMean(b);
  var va=jevVariance(a,ma),vb=jevVariance(b,mb);
  var se=Math.sqrt(va/na+vb/nb);
  if(!(se>1e-9))return null;
  var t=(ma-mb)/se;
  var num=Math.pow(va/na+vb/nb,2);
  var den=(Math.pow(va/na,2)/(na-1))+(Math.pow(vb/nb,2)/(nb-1));
  if(!(den>0))return null;
  var df=num/den;
  if(!isFinite(df)||df<=0)return null;
  return {t:t,df:df,p:Math.max(0,Math.min(1,2*jevNormSf(Math.abs(t)))),meanA:ma,meanB:mb};
}

/* Esikler tek yerde: ayarlanabilir, test edilebilir */
var JEV_THRESHOLDS={
  dailySpikeZ:3.5,        /* |degistirilmis z| esigi */
  dailySpikeP:0.02,
  freqSpikeP:0.01,        /* Poisson kuyruk olasiligi */
  budgetBreachP:0.6,      /* ay sonu asim olasiligi esigi */
  overspendRate:0.4,      /* Wilson ust siniri esigi */
  momShiftP:0.05,         /* Welch t p-degeri */
  amountOutlierZ:3.0,
  minHistoryDays:5,
  maxAnomalyAgeDays:30
};

function jevDayList(expenses){
  var byDay={};
  (expenses||[]).forEach(function(e){
    var d=String((e&&e.date)||"").slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(!byDay[d])byDay[d]=[];
    byDay[d].push(e);
  });
  return byDay;
}
/* Bir kategori icin son `days` gunun gunluk toplamlari (bos gun = 0) */
function jevDailySeries(byDay,catId,days,todayKey){
  var values=[],keys=[];
  var t=prd(todayKey);
  for(var i=days-1;i>=0;i--){
    var d=new Date(t.y,t.m,t.d-i);
    var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var s=0;
    (byDay[k]||[]).forEach(function(e){if(e.category===catId)s+=(+e.amount||0)});
    values.push(s);keys.push(k);
  }
  return {values:values,keys:keys};
}

/* Tek anomali kaydi: tipli ve yerellestirilebilir (metin arayuzde uretilir) */
function jevAnomaly(kind,severity,categoryId,score,pValue,data){
  data=data||{};
  return {
    id:kind+"|"+categoryId+"|"+(data.dayKey||""),
    kind:kind,
    severity:severity,
    categoryId:categoryId,
    score:Math.round(score*1000)/1000,
    pValue:Math.round(pValue*100000)/100000,
    data:data,
    ts:Date.now()
  };
}

/* ============================================================
   ANA TARAMA — saf kod, ~1 ms, ag yok.
   tc: {expenses, budgets, categories}
   Donus: tipli anomali listesi (onem sirali, tekrarsiz, sinirli).
   ============================================================ */
function jevScanAnomalies(tc,lang,todayKey){
  var out=[];
  var expenses=(tc&&tc.expenses)||[];
  var cats=(tc&&tc.categories)||[];
  var budgets=(tc&&tc.budgets)||{};
  var today=todayKey||tdy();
  if(expenses.length<6||cats.length===0)return out;

  var byDay=jevDayList(expenses);
  var t=prd(today);
  var dim=new Date(t.y,t.m+1,0).getDate();
  var mk=today.slice(0,7);
  var prevDate=new Date(t.y,t.m-1,1);
  var prevMK=prevDate.getFullYear()+"-"+String(prevDate.getMonth()+1).padStart(2,"0");
  var dom=t.d;
  var TH=JEV_THRESHOLDS;

  cats.forEach(function(c){
    var series=jevDailySeries(byDay,c.id,TH.maxAnomalyAgeDays,today);
    var prior=series.values.slice(0,-1);
    var todayVal=series.values[series.values.length-1]||0;
    var todayCount=((byDay[today]||[]).filter(function(e){return e.category===c.id})).length;

    /* A1) Gunluk toplam sicramasi — degistirilmis z (MAD tabanli, dayanikli) */
    var nonZero=prior.filter(function(v){return v>0});
    if(nonZero.length>=TH.minHistoryDays&&todayVal>0){
      var z=jevModifiedZ(prior,todayVal);
      var med=jevMedian(nonZero);
      if(Math.abs(z)>=TH.dailySpikeZ&&todayVal>med*1.8){
        var p=jevNormSf(Math.abs(z));
        if(p<=TH.dailySpikeP){
          out.push(jevAnomaly("cat_daily_spike",(Math.abs(z)>=5?"high":"warn"),c.id,z,p,{
            today:Math.round(todayVal*100)/100,
            typical:Math.round(med*100)/100,
            dayKey:today
          }));
        }
      }
    }

    /* A2) Islem sikligi sicramasi — Poisson kuyruk testi P(X>=k) */
    var totalTx=0;
    series.keys.forEach(function(k){
      totalTx+=((byDay[k]||[]).filter(function(e){return e.category===c.id})).length;
    });
    var activeDays=series.keys.filter(function(k){
      return ((byDay[k]||[]).filter(function(e){return e.category===c.id})).length>0;
    }).length;
    if(activeDays>=TH.minHistoryDays&&todayCount>=3){
      var lambda=totalTx/Math.max(1,series.keys.length);
      var pf=jevPoissonTailGe(todayCount,lambda);
      if(pf<=TH.freqSpikeP){
        out.push(jevAnomaly("freq_spike",(pf<=0.001?"high":"warn"),c.id,Math.min(9,-Math.log10(Math.max(pf,1e-9))),pf,{
          todayCount:todayCount,
          expected:Math.round(lambda*100)/100,
          dayKey:today
        }));
      }
    }

    /* A3) Ay sonu butce asim projeksiyonu.
       Kalan harcama X ~ Normal(mu, sigma); P(spent+X > budget) hesaplanir. */
    var budget=+budgets[c.id]||0;
    var spentSoFar=jevSum(series.values);
    var remDays=Math.max(0,dim-dom);
    var dailyAvg=spentSoFar/Math.max(1,dom);
    var projected=spentSoFar+dailyAvg*remDays;
    if(budget>0){
      var breachP=0;
      if(spentSoFar>=budget)breachP=1;
      else if(dailyAvg>0&&remDays>0){
        var mu=dailyAvg*remDays;
        var sd=Math.max(dailyAvg*0.5,budget*0.03,1)*Math.sqrt(remDays);
        breachP=jevNormSf((budget-spentSoFar-mu)/sd);
      }
      if(projected>budget&&breachP>=TH.budgetBreachP){
        out.push(jevAnomaly("budget_projection",(breachP>=0.8?"high":"warn"),c.id,breachP,1-breachP,{
          budget:Math.round(budget*100)/100,
          projected:Math.round(projected*100)/100,
          spent:Math.round(spentSoFar*100)/100,
          breachProbability:Math.round(breachP*1000)/1000,
          dayKey:today
        }));
      }
    }

    /* A3b) Sik asim orani — Wilson ust siniri (az veride guvenilir oran tahmini) */
    if(budget>0&&dim>0){
      var dailyCap=budget/dim;
      var win=series.values.slice(-15,-1);          /* son 14 tam gun */
      if(win.length>=7){
        var over=win.filter(function(v){return v>dailyCap*1.4}).length;
        var upper=jevWilsonUpper(over,win.length,1.645);
        if(upper>=TH.overspendRate&&over>=3){
          out.push(jevAnomaly("overspend_rate",(upper>=0.6?"high":"warn"),c.id,upper,1-upper,{
            daysOver:over,
            daysChecked:win.length,
            dailyCap:Math.round(dailyCap*100)/100,
            upperRate:Math.round(upper*1000)/1000,
            dayKey:today
          }));
        }
      }
    }

    /* A4) Ay-ay sapma — Welch t testi (gunluk seriler, bu ay vs gecen ay) */
    var prevDays=new Date(prevDate.getFullYear(),prevDate.getMonth()+1,0).getDate();
    var curDaily=[],prevDaily=[];
    for(var i=0;i<dom;i++){
      var k=today.slice(0,8)+String(i+1).padStart(2,"0");
      var s=0;
      (byDay[k]||[]).forEach(function(e){if(e.category===c.id)s+=(+e.amount||0)});
      curDaily.push(s);
    }
    for(var j=0;j<prevDays;j++){
      var kp=prevMK+"-"+String(j+1).padStart(2,"0");
      var sp=0;
      (byDay[kp]||[]).forEach(function(e){if(e.category===c.id)sp+=(+e.amount||0)});
      prevDaily.push(sp);
    }
    var w=jevWelch(curDaily,prevDaily);
    if(w&&w.p<=TH.momShiftP&&w.meanA>w.meanB&&w.meanA>0){
      out.push(jevAnomaly("mom_shift",(w.p<=0.01?"high":"warn"),c.id,Math.min(9,Math.abs(w.t)),w.p,{
        thisMonthDailyAvg:Math.round(w.meanA*100)/100,
        lastMonthDailyAvg:Math.round(w.meanB*100)/100,
        dayKey:mk
      }));
    }

    /* A5) Tek tutar aykirisi — log-normal z (tutarlar carpik dagilir) */
    var amounts=[];
    expenses.forEach(function(e){if(e.category===c.id&&(+e.amount||0)>0)amounts.push(+e.amount)});
    if(amounts.length>=8){
      var logs=amounts.map(function(v){return Math.log(v)});
      var lm=jevMean(logs),lsd=Math.max(jevStd(logs),1e-6);
      (byDay[today]||[]).filter(function(e){return e.category===c.id}).forEach(function(e){
        var v=+e.amount||0;
        if(v<=0)return;
        var z=(Math.log(v)-lm)/lsd;
        if(z>=TH.amountOutlierZ){
          out.push(jevAnomaly("amount_outlier",(z>=4?"high":"warn"),c.id,z,jevNormSf(z),{
            amount:Math.round(v*100)/100,
            typical:Math.round(Math.exp(lm)*100)/100,
            note:String(s_textSafe(e.note)).slice(0,80),
            dayKey:today
          }));
        }
      });
    }
  });

  /* B) SESSIZ ABONELIK: ayni not+tutar 3+ ayda tekrar ediyor ama kayitli degil.
     Bu, "farkinda olmadigin harcama" sinifidir; olasilik testi degil sayim. */
  var sig={};
  expenses.forEach(function(e){
    var n=jevNorm(e.note||"");
    if(!n||n.length<4)return;
    var amt=Math.round(+e.amount||0);
    if(amt<=0)return;
    var key=n+"|"+amt;
    if(!sig[key]){
      sig[key]={months:{},cat:e.category,note:String(s_textSafe(e.note)).slice(0,60),amount:amt,count:0,lastDay:""};
    }
    var mkx=String(e.date||"").slice(0,7);
    if(/^\d{4}-\d{2}$/.test(mkx))sig[key].months[mkx]=1;
    sig[key].count++;
    var dk=String(e.date||"").slice(0,10);
    if(dk>sig[key].lastDay)sig[key].lastDay=dk;
  });
  Object.keys(sig).forEach(function(k){
    var s=sig[k];
    var months=Object.keys(s.months).length;
    if(months>=3&&s.cat){
      out.push(jevAnomaly("silent_recurring",(months>=5?"high":"info"),s.cat,months,Math.pow(0.5,months-2),{
        note:s.note,
        amount:s.amount,
        months:months,
        dayKey:s.lastDay
      }));
    }
  });

  /* Onem sirasi: high -> warn -> info, sonra skor; ayni tur+kategori teke iner */
  var rank={high:0,warn:1,info:2};
  out.sort(function(a,b){
    var r=(rank[a.severity]||9)-(rank[b.severity]||9);
    if(r!==0)return r;
    return b.score-a.score;
  });
  var seen={},uniq=[];
  out.forEach(function(a){
    var key=a.kind+"|"+a.categoryId;
    if(seen[key])return;
    seen[key]=true;
    uniq.push(a);
  });
  return uniq.slice(0,JEV_CONFIG.maxAnomalies);
}

/* Anomali metni: yapisal veri -> yerellestirilmis baslik/detay/durum.
   Karar metni DEGIL, saf kod; DeepSeek metnini bu katman uretmez. */
function jevAnomalyText(a,catLabel,lang){
  var tr=(lang==="tr"),d=(a&&a.data)||{};
  var out={icon:"⚠️",title:"",detail:"",color:"var(--amber)"};
  if(!a)return out;
  var cv=function(v){return fmt(v,{sym:"₺",loc:tr?"tr-TR":"en-US"})};
  switch(a.kind){
    case "cat_daily_spike":
      out.icon="📈";
      out.title=tr?catLabel+" bugun alisilmadik sekilde yuksek":"Unusually high "+catLabel+" spend today";
      out.detail=tr?(cv(d.today)+" — tipik gunluk "+cv(d.typical)+" (z="+a.score+")"):(cv(d.today)+" vs typical "+cv(d.typical)+" (z="+a.score+")");
      out.color="var(--red)";
      break;
    case "freq_spike":
      out.icon="🔁";
      out.title=tr?catLabel+" icin islem sikligi artti":"Transaction frequency up for "+catLabel;
      out.detail=tr?(d.todayCount+" islem bugun; beklenen "+d.expected+"/gun (p="+a.pValue+")"):(d.todayCount+" today; expected "+d.expected+"/day (p="+a.pValue+")");
      break;
    case "budget_projection":
      out.icon="🚨";
      out.title=tr?catLabel+" butcesi asilacak gibi":" "+catLabel+" budget looks set to break";
      out.detail=tr?("Ay sonu tahmini "+cv(d.projected)+" / butce "+cv(d.budget)+" — olasilik %"+Math.round((d.breachProbability||0)*100)):("Projected "+cv(d.projected)+" vs budget "+cv(d.budget)+" — probability "+Math.round((d.breachProbability||0)*100)+"%");
      out.color="var(--red)";
      break;
    case "overspend_rate":
      out.icon="📊";
      out.title=tr?catLabel+" gunluk ortalamanin sikca uzerinde":" "+catLabel+" frequently above daily average";
      out.detail=tr?("Son "+d.daysChecked+" gunun "+d.daysOver+" tanesi limitin uzerinde (ust sinir %"+Math.round((d.upperRate||0)*100)+")"):(" "+d.daysOver+" of last "+d.daysChecked+" days over the cap (upper bound "+Math.round((d.upperRate||0)*100)+"%)");
      break;
    case "mom_shift":
      out.icon="📅";
      out.title=tr?catLabel+" gecen aya gore artti":" "+catLabel+" up versus last month";
      out.detail=tr?("Gunluk ort. "+cv(d.thisMonthDailyAvg)+" (gecen ay "+cv(d.lastMonthDailyAvg)+", p="+a.pValue+")"):("Daily avg "+cv(d.thisMonthDailyAvg)+" (last month "+cv(d.lastMonthDailyAvg)+", p="+a.pValue+")");
      break;
    case "amount_outlier":
      out.icon="💥";
      out.title=tr?"Alisilmadik buyuk tutar":"Unusually large amount";
      out.detail=tr?((d.note?("\""+d.note+"\" "):"")+catLabel+" • "+cv(d.amount)+" (tipik "+cv(d.typical)+")"):((d.note?("\""+d.note+"\" "):"")+catLabel+" • "+cv(d.amount)+" (typical "+cv(d.typical)+")");
      out.color="var(--red)";
      break;
    case "silent_recurring":
      out.icon="🕵️";
      out.title=tr?"Sessiz tekrarlayan odeme":"Silent recurring payment";
      out.detail=tr?("\""+d.note+"\" "+cv(d.amount)+" • "+d.months+" aydir tekrar ediyor, kayitli degil"):("\""+d.note+"\" "+cv(d.amount)+" • recurring for "+d.months+" months, not registered");
      break;
    default:
      out.title=tr?"Beklenmedik harcama deseni":"Unexpected spending pattern";
      out.detail=tr?"Jev arka plan taramasi bir sapma buldu.":"The Jev background scan found a deviation.";
  }
  if(a.severity==="info")out.color="var(--blue2)";
  return out;
}

/* Anomali -> DeepSeek (System 2) devir istemi.
   Rozete tiklayinca DeepSeek sohbeti bu baglamla acilir. */
function jevAnomalyToPrompt(a,catLabel,lang){
  var tr=(lang==="tr"),d=(a&&a.data)||{};
  if(!a)return "";
  var head=tr?"Jev arka plan taramasi su anormalligi buldu. Nedenini ve ne yapmam gerektigini kisaca acikla.":"The Jev background scan found this anomaly. Briefly explain why and what I should do.";
  var lines=[head,"","kind: "+a.kind,"severity: "+a.severity,"category: "+catLabel,"score: "+a.score,"p_value: "+a.pValue];
  Object.keys(d).forEach(function(k){lines.push(k+": "+d[k])});
  return lines.join("\n");
}

  t("saglayici: openrouter gecerli model slug",JEV_PROVIDERS.openrouter.model==="typesafe/jev-1.13",JEV_PROVIDERS.openrouter.model);
